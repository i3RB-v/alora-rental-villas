      State.reviews = JSON.parse(localStorage.getItem('alora_reviews')) || INITIAL_DATA.reviews;
      State.notifications = JSON.parse(localStorage.getItem('alora_notifications')) || INITIAL_DATA.notifications;

      // Sync active states on farms
      State.farms.forEach(f => {
        if (typeof f.active === 'undefined') f.active = (f.status === 'active');
        if (typeof f.featured === 'undefined') f.featured = false;
        if (!f.checkInTime) f.checkInTime = "10:00 AM";
        if (!f.checkOutTime) f.checkOutTime = "10:00 AM";
      });
    } catch (e) {
      console.error("Storage initialization error:", e);
    }
  }

  const KEY_MAP = {
    farms: 'alora_farms',
    cliqMethods: 'alora_cliq_methods',
    settings: 'alora_settings',
    websiteContent: 'alora_website_content',
    gallery: 'alora_gallery',
    bookings: 'alora_bookings',
    payments: 'alora_payments',
    blockedDates: 'alora_blocked_dates',
    emailLogs: 'alora_email_logs',
    activityLogs: 'alora_activity_logs',
    notifications: 'alora_notifications',
    promoCodes: 'alora_promo_codes',
    reviews: 'alora_reviews',
    theme: 'alora_theme'
  };

  function saveStorage(key) {
    try {
      if (key === 'all') {
        Object.keys(KEY_MAP).forEach(k => {
          if (State[k]) localStorage.setItem(KEY_MAP[k], JSON.stringify(State[k]));
        });
      } else {
        const storageKey = KEY_MAP[key] || `alora_${key}`;
        if (typeof State[key] !== 'undefined') {
          localStorage.setItem(storageKey, JSON.stringify(State[key]));
        }
      }
    } catch (e) {
      console.error(`Error saving ${key} to localStorage:`, e);
    }
  }

  // Synchronize public content with the server database when deployed.
  function syncServerData() {
    if (typeof fetch !== 'function' || !window.location || !window.location.origin) return;
    fetch('/api/bootstrap').then(r => r.ok ? r.json() : null).then(data => {
      if (!data) return;
      ['farms', 'cliqMethods', 'settings', 'websiteContent', 'gallery', 'blockedDates', 'promoCodes', 'reviews'].forEach(key => {
        if (Array.isArray(data[key]) ? data[key].length : Object.keys(data[key] || {}).length) State[key] = data[key];
      });
      saveStorage('all');
      renderApp();
    }).catch(() => {});
  }

  // TRANSLATION HELPER
  function t(key, replacements = {}) {
    const dict = (typeof TRANSLATIONS !== 'undefined' && TRANSLATIONS[State.lang]) ? TRANSLATIONS[State.lang] : {};
    let text = dict[key] || (TRANSLATIONS && TRANSLATIONS.en && TRANSLATIONS.en[key]) || (TRANSLATIONS && TRANSLATIONS.ar && TRANSLATIONS.ar[key]) || key;
    Object.keys(replacements).forEach(placeholder => {
      text = text.replace(new RegExp(`{${placeholder}}`, 'g'), replacements[placeholder]);
    });
    return text;
  }

  // DATE & PHONE VALIDATION UTILITIES
  function getNextCalendarDay(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    d.setDate(d.getDate() + 1);
    return d.toISOString().split('T')[0];
  }

  function isValidPhoneNumber(phone) {
    if (!phone) return false;
    const clean = phone.replace(/[\s\-\(\)]/g, '');
    // Jordanian format: 07[789]\d{7} or (+962|00962|962)7[789]\d{7}
    const jordanianRegex = /^(?:(?:\+|00)?962|0)?7[789]\d{7}$/;
    // General international E.164 format: starts with +, has 9 to 15 digits
    const intlRegex = /^\+[1-9]\d{8,14}$/;
    return jordanianRegex.test(clean) || intlRegex.test(clean);
  }

  function isValidCliqReference(ref) {
    if (!ref) return false;
    const clean = ref.trim();
    if (clean.length < 4 || clean.length > 30) return false;
    // Must be alphanumeric (may include hyphens, slashes, or underscores) and contain at least 3 digits
    const allowedRegex = /^[A-Za-z0-9\-\/_]+$/;
    if (!allowedRegex.test(clean)) return false;
    const digitsCount = (clean.match(/\d/g) || []).length;
    return digitsCount >= 3;
  }

  // PRICING CALCULATION ENGINE
  function calculateStayPrice(farm, checkInDate, checkOutDate, stayType, guestsCount, promoCodeStr) {
    if (!farm) return { nights: 0, isWeekend: false, baseRental: 0, weekendSurcharge: 0, extraGuestFee: 0, cleaningFee: 0, discount: 0, total: 0, valid: false };

    let nights = 1;
    let isWeekend = false;
    let valid = true;
    if (checkInDate) {
      const d = new Date(checkInDate);
      const day = d.getDay(); // 4 = Thursday, 5 = Friday
      if (day === 4 || day === 5) isWeekend = true;

      if (stayType === 'overnight' && checkOutDate) {
        const d1 = new Date(checkInDate);
        const d2 = new Date(checkOutDate);
        const y1 = d1.getFullYear();
        const y2 = d2.getFullYear();

        // Strict chronological validation & illogical year guard (e.g. 0002)
        if (isNaN(d1.getTime()) || isNaN(d2.getTime()) || y1 < 2026 || y1 > 2030 || y2 < 2026 || y2 > 2030 || d2 <= d1) {
          nights = 0;
          valid = false;
        } else {
          const diffTime = d2 - d1;
          const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
          if (diffDays <= 0 || isNaN(diffDays)) {
            nights = 0;
            valid = false;
          } else {
            // Safety cap: maximum 30 continuous nights for vacation villa rental
            nights = Math.min(30, Math.max(1, diffDays));
          }
        }
      }
    }

    if (!valid || nights <= 0) {
      return {
        nights: 0,
        isWeekend: false,
        baseRental: 0,
        weekendSurcharge: 0,
        extraGuestFee: 0,
        cleaningFee: 0,
        discount: 0,
        total: 0,
        valid: false
      };
    }

    const baseRental = Math.round(farm.price * nights);
    const weekendSurcharge = isWeekend ? Math.round(((farm.weekendPrice || farm.price * 1.3) - farm.price) * nights) : 0;

    let extraGuestFee = 0;
    const standardIncluded = 10;
    if (guestsCount > standardIncluded) {
      extraGuestFee = (guestsCount - standardIncluded) * (farm.extraGuestFee || 10) * nights;
    }

    const cleaningFee = farm.cleaningFee || 25;
    let subtotal = baseRental + weekendSurcharge + extraGuestFee + cleaningFee;

    let discount = 0;
    if (promoCodeStr) {
      const code = promoCodeStr.trim().toUpperCase();
      const p = State.promoCodes.find(item => item.code === code && item.active);
      if (p) {
        if (p.discountType === 'percentage') {
          discount = Math.round(subtotal * (p.discountValue / 100));
        } else {
          discount = Math.min(subtotal, p.discountValue);
        }
      }
    }

    const total = Math.max(0, subtotal - discount);
    return {
      nights,
      isWeekend,
      baseRental,
      weekendSurcharge,
      extraGuestFee,
      cleaningFee,
      discount,
      total,
      valid: true
    };
  }

  // AVAILABILITY & DOUBLE-BOOKING CHECK
  function isVillaAvailable(farmId, checkIn, checkOut, excludeBookingId = null) {
    if (!checkIn) return true;
    const start = new Date(checkIn);
    const end = checkOut ? new Date(checkOut) : new Date(checkIn);

    // Check blocked dates
    for (const b of State.blockedDates) {
      if (b.farmId === farmId) {
        const bDate = new Date(b.date);
        if (bDate >= start && bDate <= end) {
          return false;
        }
      }
    }

    // Check existing reservations (exclude cancelled or rejected)
    for (const res of State.bookings) {
      if (res.farmId === farmId && res.id !== excludeBookingId) {
        if (res.bookingStatus !== 'Cancelled' && res.bookingStatus !== 'Rejected') {
          const resStart = new Date(res.checkIn);
          const resEnd = new Date(res.checkOut || res.checkIn);
          if (start <= resEnd && end >= resStart) {
            return false;
          }
        }
      }
    }
    return true;
  }

    } else if (emailType === 'Reservation Cancelled') {

        : `ALORA — Reservation Cancelled #${booking.bookingNumber}`;

  // VILLA CARD COMPONENT
  function renderFarmCard(f) {
    const name = f.name[State.lang] || f.name.en;
    const desc = f.tagline ? (f.tagline[State.lang] || f.tagline.en) : (f.description[State.lang] || f.description.en);
    const city = State.lang === 'ar' ? (f.location.cityAr || f.location.city) : f.location.city;
    const area = State.lang === 'ar' ? (f.location.areaAr || f.location.area) : f.location.area;

    return `
      <div class="farm-card" id="villaCard_${f.id}">
        <div class="farm-card-media farm-card-image-wrap">
          <img src="${f.images[0]}" alt="${name}" class="farm-card-img" loading="lazy" />
          ${f.featured ? `<span class="farm-badge-top farm-badge"><span class="badge-star">★</span> ${t('featuredFarm')}</span>` : ''}
          <div class="farm-rating-top farm-rating-pill">
            <span class="rating-star">★</span> <span class="rating-score">${f.rating || '4.95'}</span> <span class="rating-count">(${f.reviewCount || 40}+)</span>
          </div>
        </div>
        <div class="farm-card-body">
          <div class="farm-card-location farm-location-badge">📍 ${city} • ${area}</div>
          <h3 class="farm-title">${name}</h3>
          <p class="farm-tagline">${desc}</p>

          <div class="farm-specs-row">
            <span>👥 ${t('upToGuests', { count: f.capacity })}</span>
            <span>🛏️ ${t('bedsCount', { count: f.bedrooms })}</span>
            <span>🚿 ${t('bathsCount', { count: f.bathrooms })}</span>
          </div>

          <div class="farm-card-footer">
            <div>
              <div class="price-period">${t('startingFrom')}</div>
              <div class="farm-price">${f.price} JOD <span class="price-period">${t('perNight')}</span></div>
              ${f.weekendPrice ? `<div style="font-size:0.75rem;color:var(--neutral-500);">${t('weekendLabel')} ${f.weekendPrice} JOD</div>` : ''}
            </div>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-outline btn-sm btn-villa-details" onclick="window.Alora.viewFarmDetails('${f.id}')">
                ${t('viewFarm')}
              </button>
              <button class="btn btn-primary btn-sm btn-villa-book" onclick="window.Alora.openBookingWizard('${f.id}')">
                ${t('bookNow')}
              </button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // ALL VILLAS CATALOG PAGE
  function renderFarmsPage() {
    let filtered = State.farms.filter(f => f.active);

    if (State.searchQuery) {
      const q = State.searchQuery.toLowerCase();
      filtered = filtered.filter(f => {
        const enName = f.name.en.toLowerCase();
        const arName = f.name.ar.toLowerCase();
        const city = f.location.city.toLowerCase();
        const area = f.location.area.toLowerCase();
        return enName.includes(q) || arName.includes(q) || city.includes(q) || area.includes(q);
      });
    }

    if (State.filterCity !== 'all') {
      filtered = filtered.filter(f => f.location.city.toLowerCase() === State.filterCity.toLowerCase());
    }

    if (State.filterGuests !== 'all') {
      const g = parseInt(State.filterGuests, 10);
      filtered = filtered.filter(f => f.capacity >= g);
    }

    if (State.filterPriceMax) {
      filtered = filtered.filter(f => f.price <= State.filterPriceMax);
    }

    // Sort
    if (State.sortBy === 'price-low') {
      filtered.sort((a, b) => a.price - b.price);
    } else if (State.sortBy === 'price-high') {
      filtered.sort((a, b) => b.price - a.price);
    } else if (State.sortBy === 'capacity') {
      filtered.sort((a, b) => b.capacity - a.capacity);
    } else {
      filtered.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0) || (b.rating - a.rating));
    }

    return `
      <div class="section bg-sand" style="padding-top:2.5rem;">
        <div class="container">
          <div class="section-header text-center">
            <div class="gold-badge">${t('allVillasBadge')}</div>
            <h1 class="section-title">${t('allVillasTitle')}</h1>
            <p class="section-subtitle">${t('allVillasSubtitle')}</p>
          </div>

          <!-- Filter Toolbar -->
          <div class="filter-bar-card">
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:1.25rem;align-items:flex-end;">
              <div>
                <label>🔍 ${t('filterSearchLabel')}</label>
                <input type="text" class="form-input" placeholder="${t('filterSearchPlaceholder')}" value="${State.searchQuery}" oninput="window.Alora.setFilter('searchQuery', this.value)" />
              </div>
              <div>
                <label>📍 ${t('filterLocationLabel')}</label>
                <select class="form-select" onchange="window.Alora.setFilter('filterCity', this.value)">
                  <option value="all" ${State.filterCity === 'all' ? 'selected' : ''}>${t('optAllLocations')}</option>
                  <option value="Dead Sea" ${State.filterCity === 'Dead Sea' ? 'selected' : ''}>Dead Sea (البحر الميت)</option>
                  <option value="Amman" ${State.filterCity === 'Amman' ? 'selected' : ''}>Amman (عمان)</option>
                  <option value="Al-Salt" ${State.filterCity === 'Al-Salt' ? 'selected' : ''}>Al-Salt (السلط)</option>
                </select>
              </div>
              <div>
                <label>👥 ${t('filterCapacityLabel')}</label>
                <select class="form-select" onchange="window.Alora.setFilter('filterGuests', this.value)">
                  <option value="all" ${State.filterGuests === 'all' ? 'selected' : ''}>${t('optAnyCapacity')}</option>
                  <option value="10" ${State.filterGuests === '10' ? 'selected' : ''}>${t('optGuests10')}</option>
                  <option value="14" ${State.filterGuests === '14' ? 'selected' : ''}>${t('optGuests14')}</option>
                  <option value="18" ${State.filterGuests === '18' ? 'selected' : ''}>${t('optGuests18')}</option>
                </select>
              </div>
              <div>
                <label>✨ ${t('filterSortLabel')}</label>
                <select class="form-select" onchange="window.Alora.setFilter('sortBy', this.value)">
                  <option value="popular" ${State.sortBy === 'popular' ? 'selected' : ''}>${t('optSortPopular')}</option>
                  <option value="price-low" ${State.sortBy === 'price-low' ? 'selected' : ''}>${t('optSortPriceLow')}</option>
                  <option value="price-high" ${State.sortBy === 'price-high' ? 'selected' : ''}>${t('optSortPriceHigh')}</option>
                  <option value="capacity" ${State.sortBy === 'capacity' ? 'selected' : ''}>${t('optSortCapacity')}</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Villas Grid -->
          ${filtered.length > 0 ? `
            <div class="farms-grid">
              ${filtered.map(f => renderFarmCard(f)).join('')}
            </div>
          ` : `
            <div style="text-align:center;padding:4rem 1rem;background:#fff;border-radius:var(--radius-lg);">
              <div style="font-size:3rem;margin-bottom:1rem;">🔍</div>
              <h3 style="font-size:1.3rem;font-weight:800;color:var(--primary-900);">${t('noVillasTitle')}</h3>
              <p style="color:var(--neutral-500);margin-bottom:1.5rem;">${t('noVillasDesc')}</p>
              <button class="btn btn-primary" onclick="window.Alora.clearFilters()">${t('clearAllFiltersBtn')}</button>
            </div>
          `}
        </div>
      </div>
    `;
  }

  // VILLA DETAILS PAGE WITH REAL 4-WEEK AVAILABILITY CALENDAR
  function renderFarmDetailsPage(farmId) {
    const farm = State.farms.find(f => f.id === farmId) || State.farms[0];

    const today = new Date();
    const days = [];

      const d = new Date(today);
      d.setDate(today.getDate() + i);
      const iso = d.toISOString().split('T')[0];
      const isAvail = isVillaAvailable(farm.id, iso, iso);
      days.push({
        date: iso,
        dayNum: d.getDate(),
        month: d.toLocaleString('en-US', { month: 'short' }),
        weekday: d.toLocaleString(State.lang === 'ar' ? 'ar-JO' : 'en-US', { weekday: 'narrow' }),
        isAvailable: isAvail

            <div class="villa-hero-side-thumbs" style="display:flex;flex-direction:column;gap:1rem;">
              <img src="${farm.images[1] || farm.images[0]}" alt="${name}" style="width:100%;height:217px;object-fit:cover;" />
              <img src="${farm.images[2] || farm.images[0]}" alt="${name}" style="width:100%;height:217px;object-fit:cover;" />
            </div>
          </div>

          <!-- Main Details & Booking Sidebar Grid -->

              <!-- Specs Card -->

                <h3 class="villa-section-title" style="font-size:1.15rem;font-weight:800;color:var(--text-color-dark, var(--primary-900));margin-bottom:1rem;">${t('propertyHighlights')}</h3>

  // CONFIRMATION VOUCHER / RECEIPT PAGE
  let _receiptFetchInProgress = null;
  let _receiptFetchFailed = null;
  function renderReceiptPage(resId) {
    let res = null;
    if (resId) {
      res = State.bookings.find(b => b.id === resId || b.bookingNumber === resId || b.booking_number === resId);
      if (!res) {
        try {
          const lastBooking = JSON.parse(sessionStorage.getItem('alora_last_booking') || 'null');
          if (lastBooking && (lastBooking.id === resId || lastBooking.bookingNumber === resId || lastBooking.booking_number === resId)) {
            res = lastBooking;
            if (!State.bookings.some(b => b.id === res.id)) {
              State.bookings.unshift(res);
              saveStorage('bookings');
            }
          }
        } catch (_) {}
      }
    } else {
      try {
        const lastBooking = JSON.parse(sessionStorage.getItem('alora_last_booking') || 'null');
        if (lastBooking) res = lastBooking;
      } catch (_) {}
    }

    // If still not found and resId is present, fetch asynchronously from the server receipt API
    if (!res && resId && _receiptFetchFailed !== resId && typeof fetch === 'function' && window.location && window.location.origin) {
      if (_receiptFetchInProgress !== resId) {
        _receiptFetchInProgress = resId;
        fetch(`/api/reservations/receipt?ref=${encodeURIComponent(resId)}`)
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (data && data.success && data.booking) {
              const b = data.booking;
              State.bookings.unshift(b);
              saveStorage('bookings');
              renderApp();
            } else {
              _receiptFetchFailed = resId;
              renderApp();
            }
          })
          .catch(() => {
            _receiptFetchFailed = resId;
            renderApp();

      return `

  // 4-STEP CUSTOMER RESERVATION WIZARD WITH MULTIPLE CLIQ PAYMENT ACCOUNTS
  function renderBookingModal() {
    const w = State.wizard;
    if (!w.open) return '';

    const farm = State.farms.find(f => f.id === w.farmId) || State.farms[0];
    const farmName = farm.name[State.lang] || farm.name.en;

    // Recalculate price & required booking deposit
    const pricing = calculateStayPrice(farm, w.checkIn, w.checkOut, w.stayType, w.guests, w.promoCode);
    w.basePrice = pricing.baseRental;
    w.weekendSurcharge = pricing.weekendSurcharge;
    w.extraGuestFee = pricing.extraGuestFee;
    w.cleaningFee = pricing.cleaningFee;
    w.discount = pricing.discount;
    w.total = pricing.total;

    const feePercent = (State.settings && State.settings.bookingFeePercent) ? State.settings.bookingFeePercent : 30;
    w.bookingFeePercent = feePercent;
    w.bookingFee = Math.round(w.total * (feePercent / 100));
    w.remainingAmount = Math.max(0, w.total - w.bookingFee);

    // Active CliQ Payment Accounts
    const activeCliqs = State.cliqMethods.filter(m => m.active);
    if (!w.selectedCliqId && activeCliqs.length > 0) {
      const def = activeCliqs.find(m => m.isDefault) || activeCliqs[0];

      b.bookingNumber.toLowerCase().includes(q) ||
      b.customerName.toLowerCase().includes(q) ||
      b.customerPhone.includes(q) ||
      (b.customerEmail && b.customerEmail.toLowerCase().includes(q)) ||
      b.farmName.toLowerCase().includes(q)
    ).slice(0, 5);

    const matchedPayments = State.payments.filter(p =>
      p.paymentReference.toLowerCase().includes(q) ||
      p.bookingNumber.toLowerCase().includes(q)
    ).slice(0, 4);

    const matchedVillas = State.farms.filter(f =>
      f.name.en.toLowerCase().includes(q) ||
      f.name.ar.toLowerCase().includes(q) ||

  // NOTIFICATIONS DROPDOWN WITH DYNAMIC LOCALIZATION
  function localizeNotification(n, isAr) {
    if (!isAr) return { title: n.title, message: n.message };
    let title = n.title;
    let message = n.message;
    const titleMap = {
      'New Payment Verification Required': 'مطلوب التحقق من دفعة جديدة',
      'Reservation Confirmed': 'تم تأكيد الحجز',
      'Payment Received': 'تم استلام الدفعة',
      'New Reservation': 'حجز جديد',
      'Reservation Cancelled': 'تم إلغاء الحجز',
      'Reservation Rejected': 'تم رفض الحجز'
    };
    if (titleMap[title]) title = titleMap[title];

    if (message.includes('submitted') && (message.includes('via') || message.includes('JOD'))) {
      message = message
        .replace(/Customer\s+([^]+?)\s+submitted\s+(\d+(?:\.\d+)?)\s*JOD\s+for\s+(#?[A-Z0-9-]+)\s+via\s+([^]+?)\s*\(([^)]+)\)/, (m, cust, amt, ref, cliq, proof) => {
          return `قام العميل ${formatCustomerName(cust)} بتقديم ${amt} دينار للحجز ${ref} عبر ${cliq} (${proof})`;
        })
        .replace(/Customer\s+([^]+?)\s+submitted/, 'قام العميل بتقديم')
        .replace(/via\s+/, 'عبر ');
    } else if (message.includes('verified and confirmed by ALORA Operations')) {
      message = message.replace(/Reservation\s+(#?[A-Z0-9-]+)\s+verified and confirmed by ALORA Operations\.?/, (m, ref) => {
        return `تم التحقق من الحجز ${ref} وتأكيده بنجاح من قِبل إدارة أورا.`;
      });
    }
    return { title, message };
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // TAB 1: OVERVIEW WITH 13 REAL-TIME KPI CARDS
  function formatCustomerName(name) {
    if (!name) return State.lang === 'ar' ? 'الضيف' : 'Guest';
    if (State.lang !== 'ar') return name;
    const map = {
      'Rania Haddad': 'رانية حداد',
      'Omar Qaisi': 'عمر القيسي',
      'Tariq Majali': 'طارق المجالي',
      'Laith Al Nimer': 'ليث النمر'
    };
    return map[name] || name;
  }

  function formatEmailType(type) {
    if (!type) return '';
    if (State.lang !== 'ar') return type;
    if (type.includes('Confirmed')) return 'تأكيد الحجز';
    if (type.includes('Received')) return 'استلام طلب الحجز';
    if (type.includes('Payment') || type.includes('Submitted')) return 'إرسال دفعة الحجز';
    return type;
  }

  function renderAdminAvailabilityTab() {
    const isAr = State.lang === 'ar';
    const farmId = State.selectedAvailVilla || State.farms[0].id;
    const farm = State.farms.find(f => f.id === farmId) || State.farms[0];
    const month = State.availMonth || 9; // September
    const year = State.availYear || 2026;

    // Generate days of month
    const daysInMonth = new Date(year, month, 0).getDate();
    const days = [];
    for (let day = 1; day <= daysInMonth; day++) {
      const dStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dObj = new Date(year, month - 1, day);
      
      // Determine day status
      let status = 'available';
      let info = isAr ? 'متاح للحجز' : 'Available';

      // Check blocked dates
      const blocked = State.blockedDates.find(b => b.farmId === farmId && b.date === dStr);
      if (blocked) {
        status = 'blocked';
        info = isAr ? `صيانة: ${blocked.reason}` : `Blocked: ${blocked.reason}`;
      } else {
        // Check reservations
        const booking = State.bookings.find(b => {
          if (b.farmId === farmId && b.bookingStatus !== 'Cancelled' && b.bookingStatus !== 'Rejected') {
            const start = b.checkIn;
            const end = b.checkOut || b.checkIn;
            return dStr >= start && dStr <= end;
          }
          return false;
        });

        if (booking) {
          if (booking.bookingStatus === 'Confirmed') {
            status = 'confirmed';
            info = isAr ? `مؤكد: #${booking.bookingNumber} (${booking.customerName})` : `Confirmed: #${booking.bookingNumber} (${booking.customerName})`;
          } else {
            status = 'pending';
            info = isAr ? `معلق: #${booking.bookingNumber} (${booking.customerName})` : `Pending: #${booking.bookingNumber} (${booking.customerName})`;
          }
        }
      }

      days.push({
        dayNum: day,
        dateStr: dStr,
        weekday: dObj.toLocaleString(isAr ? 'ar-JO' : 'en-US', { weekday: 'short' }),
        status,
        info
      });
    }

    return `
      <div>
        <div class="admin-card" style="margin-bottom:1.5rem;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
            <!-- Villa & Month Selectors -->
            <div style="display:flex;gap:1rem;align-items:center;">
              <select class="form-select" style="font-weight:700;" onchange="window.Alora.setSelectedAvailVilla(this.value)">
                ${State.farms.map(f => `
                  <option value="${f.id}" ${f.id === farmId ? 'selected' : ''}>${isAr ? f.name.ar : f.name.en}</option>
                `).join('')}
              </select>

              <div style="font-weight:800;color:var(--primary-900);font-size:1.1rem;">
                ${isAr ? 'أيلول / سبتمبر 2026' : 'September 2026'}
              </div>
            </div>

  function renderAdminCustomersTab() {
    const isAr = State.lang === 'ar';
    const customerMap = {};
    State.bookings.forEach(b => {
      const key = b.customerPhone || b.customerName;
      if (!customerMap[key]) {
        customerMap[key] = {
          name: b.customerName,
          phone: b.customerPhone,
          email: b.customerEmail,
          bookingsCount: 0,
          totalBooked: 0,
          totalPaid: 0,
          lastReservation: b.createdAt || b.checkIn,
          reservations: []
        };
      }
      customerMap[key].bookingsCount += 1;
      customerMap[key].totalBooked += (b.total || 0);
      customerMap[key].totalPaid += (b.paidAmount || (b.paymentStatus === 'Verified' ? b.bookingFee : 0) || 0);
      customerMap[key].reservations.push(b);
    });

    let customers = Object.values(customerMap);
    if (State.customerSearch) {

    return `

  function localizeActivityLog(l, isAr) {
    if (!isAr) return { admin: l.admin, action: l.action, details: l.details };
    let admin = l.admin;
    if (admin === 'ALORA Operations Team') admin = 'فريق عمليات أورا';
    else if (admin === 'ALORA Admin') admin = 'مسؤول النظام';
    else if (admin === 'Customer') admin = 'العميل';

    let action = l.action;
    const actionMap = {
      'Admin verified payment and confirmed reservation': 'تحقق المسؤول من الدفعة وتأكيد الحجز',
      'Admin updated villa pricing': 'تحديث أسعار الفيلا من المسؤول',
      'Admin edited reservation details': 'تعديل تفاصيل الحجز من المسؤول',
      'Customer submitted reservation & CLIQ deposit': 'تقديم حجز جديد وإيداع إشعار كليك من العميل',
      'Customer submitted reservation': 'تقديم حجز من العميل',
      'Admin cancelled reservation': 'إلغاء حجز من المسؤول',
      'Admin deleted reservation': 'حذف حجز من المسؤول',
      'Admin created manual reservation': 'إنشاء حجز يدوي مباشر من المسؤول',
      'Admin edited payment notes': 'تعديل ملاحظات التدقيق للدفع',
      'Admin toggled villa active status': 'تغيير حالة تفعيل الفيلا',
      'Admin toggled villa featured status': 'تغيير حالة تمييز الفيلا',
      'Admin updated villa': 'تحديث بيانات الفيلا',
      'Admin added new villa': 'إضافة فيلا جديدة',
      'Admin deleted villa': 'حذف فيلا من النظام',
      'Admin changed villa price': 'تعديل سعر الفيلا',
      'Admin blocked date': 'حظر موعد في التقويم',
      'Admin unblocked date': 'إلغاء حظر موعد في التقويم',
      'Admin toggled CliQ method status': 'تغيير حالة حساب كليك',
      'Admin set default CliQ method': 'تعيين حساب كليك الافتراضي',
      'Admin updated CliQ method': 'تحديث حساب كليك',
      'Admin added new CliQ method': 'إضافة حساب كليك جديد',
      'Admin deleted CliQ method': 'حذف حساب كليك',
      'Admin updated website content & Instagram links': 'تحديث محتوى الموقع وروابط إنستغرام',
      'Admin added gallery image': 'إضافة صورة إلى المعرض',
      'Admin deleted gallery image': 'حذف صورة من المعرض',
      'Admin changed system settings & policies': 'تعديل إعدادات وسياسات النظام',
      'Admin resent email': 'إعادة إرسال البريد الإلكتروني',
      'Admin logged in': 'تسجيل دخول المسؤول',
      'Admin logged out': 'تسجيل خروج المسؤول'
    };
    if (actionMap[action]) {
      action = actionMap[action];
    } else {
      action = action
        .replace(/^Admin verified payment/, 'تحقق المسؤول من الدفع')
        .replace(/^Admin updated/, 'تحديث من المسؤول:')
        .replace(/^Admin edited/, 'تعديل من المسؤول:')
        .replace(/^Admin created/, 'إنشاء من المسؤول:')
        .replace(/^Admin deleted/, 'حذف من المسؤول:')
        .replace(/^Customer submitted/, 'تقديم من العميل:');
    }

    let details = l.details || '';
    if (details.includes('Verified') && details.includes('deposit via')) {
      details = details
        .replace(/Verified\s+(\d+(?:\.\d+)?)\s*JOD\s+deposit via\s+([^]+?)\s*\(Ref:\s*([^)]+)\)/, 'تم التحقق من إيداع $1 دينار عبر $2 (مرجع: $3)')
        .replace(/Verified\s+(\d+(?:\.\d+)?)\s*JOD\s+deposit/, 'تم التحقق من إيداع $1 دينار');
    } else if (details.includes('Updated weekend price to')) {
      details = details.replace(/Updated weekend price to\s+(\d+)\s*JOD and holiday price to\s+(\d+)\s*JOD/, 'تحديث سعر نهاية الأسبوع إلى $1 دينار وسعر العطلات إلى $2 دينار');
    } else if (details.includes('Direct booking for')) {
      details = details.replace(/Direct booking for\s+([^]+)/, (m, c) => `حجز مباشر للعميل ${formatCustomerName(c)}`);
    } else if (details.includes('New standard rate:')) {
      details = details.replace(/New standard rate:\s+(\d+)\s*JOD/, 'السعر القياسي الجديد: $1 دينار');
    } else if (details.includes('Status is now')) {
      details = details.replace(/Status is now Active/, 'الحالة الآن: مفعل').replace(/Status is now Inactive/, 'الحالة الآن: معطل');
    } else if (details.includes('Featured:')) {
      details = details.replace(/Featured:\s*true/, 'مميز: نعم').replace(/Featured:\s*false/, 'مميز: لا');
    }

    return { admin, action, details };
  }

  // MODAL DIALOGS & OVERLAYS
  // ==========================================================================

  function renderModals() {
    let html = '';
    const isAr = State.lang === 'ar';

    // 1. Full Reservation Details Modal
    if (State.viewingReservation) {
      const b = State.viewingReservation;
      const farm = State.farms.find(f => f.id === b.farmId) || { name: { en: b.farmName, ar: b.farmName }, images: [''] };
      const farmName = isAr ? (farm.name.ar || farm.name.en) : (farm.name.en || farm.name.ar);

      const payBadge = b.paymentStatus === 'Verified' ? 'badge-verified' : (b.paymentStatus === 'Submitted' ? 'badge-submitted' : 'badge-pending');
      const payText = b.paymentStatus === 'Verified' ? t('statusVerified') : (b.paymentStatus === 'Submitted' ? t('statusSubmitted') : t('filterPending'));

      html += `
        <div class="modal-backdrop active" onclick="if(event.target===this) window.Alora.closeReservationDetails()">
          <div class="modal-card" style="max-width:760px;max-height:92vh;overflow-y:auto;" dir="${isAr ? 'rtl' : 'ltr'}">
            <div class="modal-header">
              <div>
                <h3 class="modal-title">${t('modalResDetailsTitle')} #${b.bookingNumber}</h3>
                <div style="font-size:0.85rem;color:var(--neutral-500);">${t('modalCreatedOn')} ${b.createdAt ? b.createdAt.split('T')[0] : '2026-09-19'}</div>
              </div>
              <button class="btn-modal-close" onclick="window.Alora.closeReservationDetails()">✕</button>
            </div>

            <div class="modal-body">
              <!-- Customer Section -->
              <div style="background:#f8fafc;padding:1.25rem;border-radius:var(--radius-lg);margin-bottom:1.5rem;border:1px solid #e2e8f0;">
                <h4 style="font-size:1rem;font-weight:800;color:var(--primary-900);margin:0 0 0.75rem 0;">${t('modalCustomerInfo')}</h4>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;font-size:0.9rem;">
                  <div><span style="color:var(--neutral-500);">${t('modalCustomerName')}</span> <strong>${formatCustomerName(b.customerName)}</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalCustomerPhone')}</span> <strong dir="ltr">${b.customerPhone}</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalCustomerEmail')}</span> <strong>${b.customerEmail || t('modalNoneProvided')}</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalCustomerNotes')}</span> <span>${b.notes || t('modalNoSpecialRequests')}</span></div>
                </div>
              </div>

              <!-- Villa Section -->
              <div style="background:#f8fafc;padding:1.25rem;border-radius:var(--radius-lg);margin-bottom:1.5rem;border:1px solid #e2e8f0;display:flex;align-items:center;gap:1rem;">
                <img src="${farm.images[0]}" alt="${farmName}" style="width:90px;height:70px;border-radius:6px;object-fit:cover;" />
                <div>
                  <h4 style="font-size:1.05rem;font-weight:800;color:var(--primary-900);margin:0 0 4px 0;">🏡 ${farmName}</h4>
                  <div style="font-size:0.85rem;color:var(--neutral-600);">${isAr ? 'معرف الفيلا:' : 'Villa ID:'} ${b.farmId}</div>
                  <div style="font-size:0.85rem;color:var(--neutral-500);">${t('modalStandardRate')} ${farm.price || 200} JOD/${isAr ? 'ليلة' : 'night'}</div>
                </div>
              </div>

              <!-- Reservation Details Section -->
              <div style="background:#f8fafc;padding:1.25rem;border-radius:var(--radius-lg);margin-bottom:1.5rem;border:1px solid #e2e8f0;">
                <h4 style="font-size:1rem;font-weight:800;color:var(--primary-900);margin:0 0 0.75rem 0;">${t('modalResSummary')}</h4>
                <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:0.75rem;font-size:0.9rem;">
                  <div><span style="color:var(--neutral-500);">${t('modalCheckIn')}</span> <strong>${b.checkIn} (${b.checkInTime || (isAr ? '10:00 صباحاً' : '10:00 AM')})</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalCheckOut')}</span> <strong>${b.checkOut || b.checkIn} (${b.checkOutTime || (isAr ? '10:00 صباحاً' : '10:00 AM')})</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalGuests')}</span> <strong>${b.guests} ${isAr ? 'ضيوف' : 'Guests'}</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalStayType')}</span> <strong>${b.stayType === 'overnight' ? t('modalStayOvernight') : t('modalStayDayUse')}</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalTotalStay')}</span> <strong style="font-size:1.1rem;color:var(--primary-900);">${b.total} JOD</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalDeposit')}</span> <strong style="color:#276749;">${b.bookingFee || Math.round(b.total * 0.3)} JOD</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalPaidAmount')}</span> <strong>${b.paidAmount || (b.paymentStatus === 'Verified' ? b.bookingFee : 0)} JOD</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalRemaining')}</span> <strong>${b.remainingAmount || (b.total - (b.paidAmount || 0))} JOD</strong></div>
                </div>
              </div>

              <!-- CliQ Payment Section -->
              <div style="background:#f8fafc;padding:1.25rem;border-radius:var(--radius-lg);margin-bottom:1.5rem;border:1px solid #e2e8f0;">
                <h4 style="font-size:1rem;font-weight:800;color:var(--primary-900);margin:0 0 0.75rem 0;">${t('modalCliqPayment')}</h4>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;font-size:0.9rem;">
                  <div><span style="color:var(--neutral-500);">${t('modalCliqAccount')}</span> <strong>${b.paymentMethodName || 'ALORA Main CliQ'}</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalCliqAlias')}</span> <strong class="cliq-alias-badge" style="padding:2px 6px;font-size:0.8rem;">${b.cliqAlias || 'ALORA@INVEST'}</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalTxRef')}</span> <strong style="font-family:monospace;color:var(--primary-900);">${b.paymentReference || '—'}</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalPaymentStatus')}</span> <span class="${payBadge}">${payText}</span></div>
                  <div><span style="color:var(--neutral-500);">${t('modalVerifiedBy')}</span> <strong>${b.verifiedBy || t('modalPendingVerification')}</strong></div>
                  <div><span style="color:var(--neutral-500);">${t('modalVerificationDate')}</span> <span>${b.verifiedDate || t('modalNotVerifiedYet')}</span></div>
                </div>

                ${b.paymentProof ? `
                  <div style="margin-top:1rem;padding-top:0.75rem;border-top:1px dashed #cbd5e0;">
                    <div style="font-size:0.8rem;color:var(--neutral-500);margin-bottom:6px;">${t('modalSubmittedProof')}</div>
                    <img src="${b.paymentProof}" alt="Receipt" style="max-width:240px;height:auto;border-radius:6px;border:1px solid #cbd5e0;cursor:pointer;" onclick="window.Alora.viewPaymentProof('${b.paymentProof}', '${b.bookingNumber}')" />

                ` : ''}
              </div>

              <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;border-top:1px solid #e2e8f0;padding-top:1.25rem;">
                ${b.bookingStatus === 'Pending' ? `
                  <button class="btn btn-primary" onclick="window.Alora.verifyPaymentForBooking('${b.id}')">
                    ${t('modalBtnVerifyConfirm')}
                  </button>
                  <button class="btn btn-outline" style="color:#e53e3e;border-color:#feb2b2;" onclick="window.Alora.rejectPaymentForBooking('${b.id}')">
                    ${t('modalBtnRejectRes')}
                  </button>
                ` : ''}

                ${b.bookingStatus === 'Confirmed' ? `
                  <button class="btn btn-outline" style="color:#d69e2e;" onclick="window.Alora.cancelBooking('${b.id}')">
                    ${t('modalBtnCancelRes')}
                  </button>
                ` : ''}

                <button class="btn btn-outline" onclick="window.Alora.openEditReservationModal('${b.id}')">
                  ${t('modalBtnEditDetails')}
                </button>
                <button class="btn btn-outline" onclick="window.Alora.resendBookingReceipt('${b.id}')">
                  ${t('modalBtnResendReceipt')}
                </button>
                <button class="btn btn-outline" style="color:#e53e3e;" onclick="window.Alora.deleteBooking('${b.id}')">
                  ${t('modalBtnDelete')}
                </button>
                <button class="btn btn-outline" onclick="window.Alora.closeReservationDetails()">
                  ${t('modalBtnClose')}
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 2. Admin Create Reservation Modal
    if (State.adminCreatingReservation) {
      html += `
        <div class="modal-backdrop active" onclick="if(event.target===this) window.Alora.closeAdminCreateReservation()">
          <div class="modal-card" style="max-width:640px;" dir="${isAr ? 'rtl' : 'ltr'}">
            <div class="modal-header">
              <h3 class="modal-title">${t('modalCreateResTitle')}</h3>
              <button class="btn-modal-close" onclick="window.Alora.closeAdminCreateReservation()">✕</button>
            </div>
            <div class="modal-body">
              <form onsubmit="window.Alora.saveAdminCreatedReservation(event)">
                <div class="form-group" style="margin-bottom:1rem;">
                  <label class="form-label" style="font-weight:700;">${t('modalSelectVilla')}</label>
                  <select id="admResVilla" class="form-select" required>
                    ${State.farms.map(f => `<option value="${f.id}">${isAr ? f.name.ar : f.name.en} (${f.price} JOD)</option>`).join('')}
                  </select>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalCustomerNameReq')}</label>
                    <input type="text" id="admResCustName" class="form-input" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalPhoneReq')}</label>
                    <input type="tel" id="admResCustPhone" class="form-input" dir="ltr" required />
                  </div>
                </div>
                <div class="form-group" style="margin-bottom:1rem;">
                  <label class="form-label" style="font-weight:700;">${t('modalEmailOpt')}</label>
                  <input type="email" id="admResCustEmail" class="form-input" dir="ltr" />
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalCheckInReq')}</label>
                    <input type="date" id="admResCheckIn" class="form-input" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalCheckOutReq')}</label>
                    <input type="date" id="admResCheckOut" class="form-input" required />
                  </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalGuestsCount')}</label>
                    <input type="number" id="admResGuests" class="form-input" value="10" min="1" max="40" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalAgreedPrice')}</label>
                    <input type="number" id="admResTotal" class="form-input" placeholder="e.g. 350" required />
                  </div>
                </div>
                <div class="form-group" style="margin-bottom:1.5rem;">
                  <label class="form-label" style="font-weight:700;">${t('modalCliqMethod')}</label>
                  <select id="admResCliq" class="form-select">
                    ${State.cliqMethods.map(m => `<option value="${m.id}">${isAr ? (m.nameAr || m.name) : m.name} (${m.alias})</option>`).join('')}
                  </select>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:10px;">
                  <button type="button" class="btn btn-outline" onclick="window.Alora.closeAdminCreateReservation()">${t('modalBtnCancel')}</button>
                  <button type="submit" class="btn btn-primary">${t('modalBtnCreateConfirm')}</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    // 3. Edit Reservation Modal
    if (State.editingReservation) {
      const b = State.editingReservation;
      html += `
        <div class="modal-backdrop active" onclick="if(event.target===this) window.Alora.closeEditReservationModal()">
          <div class="modal-card" style="max-width:560px;" dir="${isAr ? 'rtl' : 'ltr'}">
            <div class="modal-header">
              <h3 class="modal-title">${t('modalEditResTitle')} #${b.bookingNumber}</h3>
              <button class="btn-modal-close" onclick="window.Alora.closeEditReservationModal()">✕</button>
            </div>
            <div class="modal-body">
              <form onsubmit="window.Alora.saveEditedReservation(event)">
                <div class="form-group" style="margin-bottom:1rem;">
                  <label class="form-label" style="font-weight:700;">${t('modalCustomerNameReq')}</label>
                  <input type="text" id="editResCustName" class="form-input" value="${b.customerName}" required />
                </div>
                <div class="form-group" style="margin-bottom:1rem;">
                  <label class="form-label" style="font-weight:700;">${t('modalPhoneReq')}</label>
                  <input type="tel" id="editResCustPhone" class="form-input" dir="ltr" value="${b.customerPhone}" required />
                </div>
                <div class="form-group" style="margin-bottom:1rem;">
                  <label class="form-label" style="font-weight:700;">${t('modalCustomerEmail')}</label>
                  <input type="email" id="editResCustEmail" class="form-input" dir="ltr" value="${b.customerEmail || ''}" />
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalCheckInReq')}</label>
                    <input type="date" id="editResCheckIn" class="form-input" value="${b.checkIn}" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalCheckOutReq')}</label>
                    <input type="date" id="editResCheckOut" class="form-input" value="${b.checkOut || b.checkIn}" required />
                  </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalGuests')}</label>
                    <input type="number" id="editResGuests" class="form-input" value="${b.guests}" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalTotalStay')}</label>
                    <input type="number" id="editResTotal" class="form-input" value="${b.total}" required />
                  </div>
                </div>
                <div class="form-group" style="margin-bottom:1.5rem;">
                  <label class="form-label" style="font-weight:700;">${t('modalStatusLabel')}</label>
                  <select id="editResStatus" class="form-select">
                    <option value="Pending" ${b.bookingStatus === 'Pending' ? 'selected' : ''}>${t('filterPending')}</option>
                    <option value="Confirmed" ${b.bookingStatus === 'Confirmed' ? 'selected' : ''}>${t('statusConfirmed')}</option>
                    <option value="Cancelled" ${b.bookingStatus === 'Cancelled' ? 'selected' : ''}>${t('statusCancelled')}</option>
                    <option value="Rejected" ${b.bookingStatus === 'Rejected' ? 'selected' : ''}>${t('statusRejected')}</option>
                  </select>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:10px;">
                  <button type="button" class="btn btn-outline" onclick="window.Alora.closeEditReservationModal()">${t('modalBtnCancel')}</button>
                  <button type="submit" class="btn btn-primary">${t('modalBtnSave')}</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    // 4. View Payment Proof Modal
    if (State.selectedPaymentProof) {
      html += `
        <div class="modal-backdrop active" onclick="if(event.target===this) window.Alora.closePaymentProof()">
          <div class="modal-card" style="max-width:540px;" dir="${isAr ? 'rtl' : 'ltr'}">
            <div class="modal-header">
              <h3 class="modal-title">${t('modalPaymentProofTitle')} — #${State.selectedPaymentProof.ref}</h3>
              <button class="btn-modal-close" onclick="window.Alora.closePaymentProof()">✕</button>
            </div>
            <div class="modal-body" style="text-align:center;">
              <img src="${State.selectedPaymentProof.url}" alt="CliQ Receipt" style="max-width:100%;max-height:480px;border-radius:8px;border:1px solid #cbd5e0;box-shadow:0 4px 15px rgba(0,0,0,0.1);" />
            </div>
            <div class="modal-footer" style="padding:1rem;display:flex;justify-content:flex-end;">
              <button class="btn btn-primary" onclick="window.Alora.closePaymentProof()">${t('modalBtnCloseViewer')}</button>
            </div>
          </div>
        </div>
      `;
    }

    // 5. Customer History Modal
    if (State.viewingCustomer) {
      const c = State.viewingCustomer;
      html += `
        <div class="modal-backdrop active" onclick="if(event.target===this) window.Alora.closeCustomerHistoryModal()">
          <div class="modal-card customer-history-modal" style="max-width:760px;" dir="${isAr ? 'rtl' : 'ltr'}">
            <div class="modal-header">
              <div>
                <h3 class="modal-title">${t('modalCustHistoryTitle')} — ${formatCustomerName(c.name)}</h3>
                <div style="font-size:0.85rem;color:var(--neutral-500);"><span dir="ltr">${c.phone}</span> • ${c.email || t('modalNoneProvided')}</div>

              <button class="btn-modal-close" onclick="window.Alora.closeCustomerHistoryModal()">✕</button>
            </div>
            <div class="modal-body">
              <div style="display:flex;gap:1.5rem;background:#f8fafc;padding:1.2rem 1.5rem;border-radius:12px;margin-bottom:1.5rem;flex-wrap:wrap;border:1px solid #e2e8f0;">
                <div>${t('modalTotalStays')} <strong>${c.bookingsCount}</strong></div>
                <div>${t('modalTotalBooked')} <strong>${c.totalBooked} JOD</strong></div>
                <div>${t('modalTotalPaid')} <strong style="color:#276749;">${c.totalPaid} JOD</strong></div>
              </div>

              <div class="admin-table-container">
                <table>
                  <thead>
                    <tr>
                      <th>${t('tableRecordRef')}</th>
                      <th>${t('tableVilla')}</th>
                      <th>${t('tableDates')}</th>
                      <th>${t('tableAmount')}</th>
                      <th>${t('tableStatus')}</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${c.reservations.map(res => {
                      const farmObj = State.farms.find(f => f.id === res.farmId);
                      const vName = isAr ? (farmObj?.name.ar || res.farmName) : (farmObj?.name.en || res.farmName);
                      const bookBadge = res.bookingStatus === 'Confirmed' ? 'badge-verified' : (res.bookingStatus === 'Pending' ? 'badge-submitted' : 'badge-rejected');
                      const bookText = res.bookingStatus === 'Confirmed' ? t('statusConfirmed') : (res.bookingStatus === 'Pending' ? t('statusPendingApproval') : t('statusRejected'));
                      return `
                      <tr>
                        <td><strong>${res.bookingNumber}</strong></td>
                        <td>${vName}</td>
                        <td>${res.checkIn}</td>
                        <td>${res.total} JOD</td>
                        <td><span class="${bookBadge}">${bookText}</span></td>
                      </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 6. Add/Edit CliQ Modal
    if (State.addingCliq || State.editingCliq) {
      const isEdit = !!State.editingCliq;
      const cliq = isEdit ? State.editingCliq : {
        name: '',
        nameAr: '',
        displayName: '',
        displayNameAr: '',
        alias: '',
        accountPhone: '+962 7 9184 5632',
        bankName: isAr ? 'البنك العربي' : 'Arab Bank',
        bankNameAr: 'البنك العربي',
        instructions: 'Please transfer the required 30% booking fee to this CliQ account.',
        instructionsAr: 'يرجى تحويل دفعة الحجز المطلوبة 30% إلى حساب كليك هذا.',
        qrCode: '',
        active: true,
        isDefault: false
      };

      html += `
        <div class="modal-backdrop active" onclick="if(event.target===this) window.Alora.closeCliqModal()">
          <div class="modal-card" style="max-width:580px;" dir="${isAr ? 'rtl' : 'ltr'}">

              <h3 class="modal-title">${isEdit ? t('modalEditCliqTitle') : t('modalAddCliqTitle')}</h3>
              <button class="btn-modal-close" onclick="window.Alora.closeCliqModal()">✕</button>
            </div>
            <div class="modal-body">
              <form onsubmit="window.Alora.saveCliqMethod(event, ${isEdit ? `'${cliq.id}'` : 'null'})">
                <div class="form-group" style="margin-bottom:1rem;">
                  <label class="form-label" style="font-weight:700;">${t('modalCliqName')}</label>
                  <input type="text" id="cliqNameInput" class="form-input" placeholder="e.g. ALORA Main CliQ" value="${isAr ? (cliq.nameAr || cliq.name) : cliq.name}" required />

                <div class="form-group" style="margin-bottom:1rem;">
                  <label class="form-label" style="font-weight:700;">${t('modalCliqDispName')}</label>

                </div>
                <div class="form-group" style="margin-bottom:1rem;">
                  <label class="form-label" style="font-weight:700;">${t('modalCliqAliasReq')}</label>
                  <input type="text" id="cliqAliasInput" class="form-input" dir="ltr" placeholder="e.g. ALORA@INVEST or phone number" value="${cliq.alias}" required />
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalCliqBank')}</label>
                    <input type="text" id="cliqBankInput" class="form-input" placeholder="${isAr ? 'البنك العربي' : 'Arab Bank'}" value="${isAr ? (cliq.bankNameAr || cliq.bankName || '') : (cliq.bankName || '')}" />
                  </div>
                  <div class="form-group">
                    <label class="form-label" style="font-weight:700;">${t('modalCliqPhone')}</label>
                    <input type="text" id="cliqPhoneInput" class="form-input" dir="ltr" placeholder="+962 7 9184 5632" value="${cliq.accountPhone || ''}" />
                  </div>
                </div>

    // 8b. Edit Payment Notes Modal (Replaces browser prompt with custom design system modal)

  function renderApp() {
    const root = document.getElementById('app');
    if (!root) return;

    // Preserve the active form control and caret when state updates trigger a
    // render. Without this, an oninput handler replaces the DOM node after
    // the first character and the user has to click the field again.
    const active = document.activeElement;
    const activeId = active && active.id;
    const selectionStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    const selectionEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

    // Document Direction, Language & Active Creative Theme
    document.documentElement.lang = State.lang;
    document.documentElement.dir = State.lang === 'ar' ? 'rtl' : 'ltr';
    const activeTheme = State.theme || 'emerald';
    if (document.documentElement && typeof document.documentElement.setAttribute === 'function') {
      document.documentElement.setAttribute('data-theme', activeTheme);
    }
    if (document.body && typeof document.body === 'object') {
      document.body.className = `theme-${activeTheme} movement-animated-theme`;
    }

    let content = '';

    // Check if in Admin Area
    if (State.currentPage === 'admin') {
      if (!State.currentUser) {
        content = renderAdminLoginPage();
      } else {
        content = renderDedicatedAdminPortal();
      }
    } else {
      // Public Customer Pages
      content += renderNavbar();

      if (State.currentPage === 'home') {
        content += renderHero();
        content += renderFeaturedSection();
        content += renderWhyChooseUs();
        content += renderInstagramSection();
        content += renderReviewsSection();
        content += renderContactSection();
      } else if (State.currentPage === 'farms') {
        content += renderFarmsPage();
      } else if (State.currentPage === 'farm-details') {
        content += renderFarmDetailsPage(State.selectedFarmId);
      } else if (State.currentPage === 'gallery') {
        content += renderGalleryPage();
      } else if (State.currentPage === 'receipt') {
        content += renderReceiptPage(State.params.id);
      } else if (State.currentPage === 'find-booking') {
        content += renderFindBookingPage();
      } else if (State.currentPage === 'policies') {
        content += renderPoliciesPage();
      } else {
        content += renderHero();
        content += renderFeaturedSection();
      }

      content += renderFooter();
      content += renderFloatingWidgets();
      content += renderBookingModal();
    }

    content += renderModals();
    root.innerHTML = content;

    if (activeId && active && active.tagName !== 'BUTTON' && active.tagName !== 'A') {
      const restored = document.getElementById(activeId);
      if (restored && typeof restored.focus === 'function') {
        try {
          restored.focus({ preventScroll: true });
          if (selectionStart !== null && typeof restored.setSelectionRange === 'function') {
            const end = selectionEnd === null ? selectionStart : selectionEnd;
            restored.setSelectionRange(selectionStart, end);
          }
        } catch (_) {}
      }
    }
  }

  // TOAST NOTIFICATIONS
  function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `alora-toast toast-${type}`;
    toast.style.cssText = `
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: ${type === 'error' ? '#c53030' : (type === 'success' ? '#22543d' : '#1a202c')};
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 99999;
      transition: opacity 0.3s ease;
    `;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, 3500);
  }

  // CLIPBOARD HELPER
  function copyToClipboard(text, label = 'Text') {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`${label} copied to clipboard!`, 'success');
      });
    } else {
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast(`${label} copied to clipboard!`, 'success');
    }
  }

            State.lookupResult = res.booking;
            renderApp();
            showToast(t('paymentVerifiedSuccess') || 'Booking found!', 'success');
          } else {
            // Local fallback check
            const localBooking = State.bookings.find(b => 
              b.bookingNumber.toUpperCase() === ref.toUpperCase() && 
              (b.customerPhone.includes(contact) || (b.customerEmail && b.customerEmail.toLowerCase() === contact.toLowerCase()))
            );
            if (localBooking) {
              State.lookupResult = localBooking;
              renderApp();
            } else {
              showToast(t('bookingNotFound') || 'No booking found matching credentials', 'error');
            }
          }
        })
        .catch(() => {
          const localBooking = State.bookings.find(b => 
            b.bookingNumber.toUpperCase() === ref.toUpperCase() && 
            (b.customerPhone.includes(contact) || (b.customerEmail && b.customerEmail.toLowerCase() === contact.toLowerCase()))

    proceedToClickPayment: async function() {
      const w = State.wizard;
      const farm = State.farms.find(f => f.id === w.farmId) || State.farms[0];
      const checkEnd = w.stayType === 'daily' ? w.checkIn : w.checkOut;

      // 1. Double booking pre-check
      if (!isVillaAvailable(w.farmId, w.checkIn, checkEnd)) {
        showToast(t('errDoubleBooking'), 'error');
        w.step = 1;
        renderApp();
        return;
      }

      showToast(t('clickProcessing') || 'Creating Click payment session...', 'info');

      // 2. Call server to create booking and initiate Click payment
      try {
        const res = await fetch('/api/reservations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            farmId: w.farmId,
            villaId: w.farmId,
            checkIn: w.checkIn,
            checkOut: checkEnd,
            stayType: w.stayType,
            customerName: w.customerName,
            customerPhone: w.customerPhone,
            customerEmail: w.customerEmail,
            guests: w.guests,
            promoCode: w.promoCode,
            notes: w.notes
          })
        });

        if (!res.ok) {
          if (res.status === 404 || res.status === 405) {
            this.confirmBookingFinal();
            return;
          }
          const err = await res.json().catch(() => ({}));
          showToast(err.error || 'Unable to reserve villa for these dates', 'error');
          return;
        }

        const data = await res.json();
        const booking = data.booking;

        // Ensure consistent structure and store immediately in State.bookings and sessionStorage
        const formattedBooking = {
          ...booking,
          id: booking.id,
          bookingNumber: booking.booking_number || booking.bookingNumber,
          customerName: booking.customer_name || booking.customerName,
          customerPhone: booking.customer_phone || booking.customerPhone,
          customerEmail: booking.customer_email || booking.customerEmail,
          farmId: booking.villa_id || booking.farmId,
          farmName: booking.villa_name || booking.farmName,
          checkIn: booking.check_in || booking.checkIn,
          checkOut: booking.check_out || booking.checkOut,
          checkInTime: booking.check_in_time || booking.checkInTime || '10:00 AM',
          checkOutTime: booking.check_out_time || booking.checkOutTime || '10:00 AM',
          stayType: booking.stay_type || booking.stayType,
          guests: booking.guests,
          total: booking.total_amount || booking.total,
          bookingFeePercent: booking.deposit_percent || booking.bookingFeePercent || 30,
          bookingFee: booking.deposit_amount || booking.bookingFee,
          bookingStatus: booking.booking_status || booking.bookingStatus || 'Pending',
          paymentStatus: booking.payment_status || booking.paymentStatus || 'Submitted',
          paymentReference: booking.booking_number || booking.bookingNumber,
          paymentMethodName: 'Click / JoPACC',
          notes: booking.notes || ''
        };
        State.bookings.unshift(formattedBooking);
        saveStorage('bookings');
        try {
          sessionStorage.setItem('alora_last_booking', JSON.stringify(formattedBooking));
        } catch (_) {}

        // 3. Initiate Click checkout session
        const clickRes = await fetch('/api/payments/click/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bookingId: booking.id, bookingNumber: booking.booking_number })
        });

        const clickData = await clickRes.json();
        if (clickData.success && clickData.session && clickData.session.checkoutUrl) {
          showToast(t('clickRedirectNotice') || 'Redirecting to Click payment portal...', 'success');
          setTimeout(() => {
            window.location.href = clickData.session.checkoutUrl;
          }, 600);
        } else {
          // Fallback to local confirm
          this.confirmBookingFinal();
        }
      } catch (e) {
        // Fallback to local booking confirmation if server is offline
        this.confirmBookingFinal();
      }
    },
