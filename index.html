    handleWizardDateChange: function(field, rawVal) {
      if (!rawVal) return;
      const todayStr = new Date().toISOString().split('T')[0];
      const parts = rawVal.split('-');
      const year = parts.length > 0 ? parseInt(parts[0], 10) : 0;

      // 1. Strict year and impossible format validation
      if (isNaN(year) || year < 2026 || year > 2028) {
        showToast(State.lang === 'ar' ? 'يرجى إدخال تاريخ صالح بين عامي 2026 و 2028' : 'Please select a valid date between 2026 and 2028', 'warning');
        const fallback = field === 'checkIn' ? todayStr : getNextCalendarDay(State.wizard.checkIn || todayStr);
        State.wizard[field] = fallback;
        const el = document.getElementById(field === 'checkIn' ? 'wizCheckIn' : 'wizCheckOut');
        if (el) el.value = fallback;
        renderApp();
        return;
      }

      // 2. Prevent past dates
      if (rawVal < todayStr) {
        showToast(State.lang === 'ar' ? 'لا يمكن اختيار تاريخ في الماضي' : 'Check-in date cannot be in the past', 'warning');
        State.wizard[field] = todayStr;
        const el = document.getElementById(field === 'checkIn' ? 'wizCheckIn' : 'wizCheckOut');
        if (el) el.value = todayStr;
        renderApp();
        return;
      }

      // 3. Chronological sequence & length bounds
      if (field === 'checkIn') {
        State.wizard.checkIn = rawVal;
        if (State.wizard.stayType === 'overnight') {
          const next = getNextCalendarDay(rawVal);
          if (!State.wizard.checkOut || State.wizard.checkOut <= rawVal) {
            State.wizard.checkOut = next;
          } else {
            const dIn = new Date(rawVal);
            const dOut = new Date(State.wizard.checkOut);
            const diffDays = Math.round((dOut - dIn) / (1000 * 60 * 60 * 24));
            if (diffDays > 30) {
              showToast(State.lang === 'ar' ? 'أقصى مدة للحجز المتصل هي 30 يوماً' : 'Maximum continuous booking duration is 30 days', 'warning');
              const maxDate = new Date(dIn);
              maxDate.setDate(maxDate.getDate() + 30);
              State.wizard.checkOut = maxDate.toISOString().split('T')[0];
            }
          }
        }
      } else if (field === 'checkOut') {
        if (State.wizard.stayType === 'overnight') {
          if (rawVal <= State.wizard.checkIn) {
            showToast(t('errCheckOutAfterCheckIn') || (State.lang === 'ar' ? 'تاريخ تسجيل المغادرة يجب أن يكون بعد تاريخ الوصول' : 'Check-out date must be after check-in date'), 'error');
            const next = getNextCalendarDay(State.wizard.checkIn || todayStr);
            State.wizard.checkOut = next;
            const el = document.getElementById('wizCheckOut');
            if (el) el.value = next;
            renderApp();
            return;
          }
          const dIn = new Date(State.wizard.checkIn);
          const dOut = new Date(rawVal);
          const diffDays = Math.round((dOut - dIn) / (1000 * 60 * 60 * 24));
          if (diffDays > 30) {
            showToast(State.lang === 'ar' ? 'أقصى مدة للحجز المتصل هي 30 يوماً' : 'Maximum continuous booking duration is 30 days', 'warning');
            const maxDate = new Date(dIn);
            maxDate.setDate(maxDate.getDate() + 30);
            State.wizard.checkOut = maxDate.toISOString().split('T')[0];
          } else {
            State.wizard.checkOut = rawVal;
          }
        }
      }

      this.updateWizardState(field, State.wizard[field], true);
    },

    updateWizardState: function(field, val, shouldRender = true) {
      State.wizard[field] = val;
      if (field === 'checkIn' && State.wizard.stayType === 'overnight') {
        const next = getNextCalendarDay(val);
        if (!State.wizard.checkOut || State.wizard.checkOut <= val) {
          State.wizard.checkOut = next;
        }
      } else if (field === 'checkOut' && State.wizard.stayType === 'overnight') {
        if (State.wizard.checkIn && val <= State.wizard.checkIn) {
          showToast(t('errCheckOutAfterCheckIn') || t('errOvernightCheckOutSubsequent'), 'error');
        }
      } else if (field === 'stayType' && val === 'overnight') {
        if (!State.wizard.checkOut || State.wizard.checkOut <= State.wizard.checkIn) {
          State.wizard.checkOut = getNextCalendarDay(State.wizard.checkIn || new Date().toISOString().split('T')[0]);
        }
      }
      if (shouldRender) {
        renderApp();
      }
    },

    validateStep1: function() {
      const w = State.wizard;
      const todayStr = new Date().toISOString().split('T')[0];

      if (!w.checkIn) {
        showToast(State.lang === 'ar' ? 'يرجى اختيار تاريخ الوصول' : 'Please select a check-in date', 'error');
        return;
      }

      const pIn = w.checkIn.split('-');
      const yIn = pIn.length > 0 ? parseInt(pIn[0], 10) : 0;
      if (isNaN(yIn) || yIn < 2026 || yIn > 2028 || w.checkIn < todayStr) {
        showToast(State.lang === 'ar' ? 'يرجى إدخال تاريخ وصول صالح بين 2026 و 2028' : 'Please select a valid check-in date between 2026 and 2028', 'error');
        w.checkIn = todayStr;
        renderApp();
        return;
      }

      if (w.stayType === 'overnight') {
        if (!w.checkOut) {
          showToast(t('errOvernightCheckOutSubsequent'), 'error');
          return;
        }
        const pOut = w.checkOut.split('-');
        const yOut = pOut.length > 0 ? parseInt(pOut[0], 10) : 0;
        if (isNaN(yOut) || yOut < 2026 || yOut > 2028 || w.checkOut <= w.checkIn) {
          showToast(t('errCheckOutAfterCheckIn') || t('errOvernightCheckOutSubsequent'), 'error');
          w.checkOut = getNextCalendarDay(w.checkIn);
          renderApp();
          return;
        }
      }

      // Check double-booking availability
      const isAvail = isVillaAvailable(w.farmId, w.checkIn, w.stayType === 'daily' ? w.checkIn : w.checkOut);
      if (!isAvail) {
        showToast(t('errDoubleBooking'), 'error');
        return;
      }

      w.step = 2;
      renderApp();
    },

    validateStep2: function() {
      const w = State.wizard;
      const name = document.getElementById('wizCustName')?.value.trim();
      const phone = document.getElementById('wizCustPhone')?.value.trim();
      const email = document.getElementById('wizCustEmail')?.value.trim();

      if (!name) {
        showToast(State.lang === 'ar' ? 'يرجى إدخال الاسم الكامل' : 'Please enter your full name', 'error');
        return;
      }
      if (!phone || !isValidPhoneNumber(phone)) {
        showToast(t('errInvalidPhone'), 'error');
        return;
      }

      w.customerName = name;
      w.customerPhone = phone;
      w.customerEmail = email || '';
      w.step = 3;
      renderApp();
    },

    validateStep3: function() {
      const w = State.wizard;
      const ref = document.getElementById('wizPaymentRef')?.value.trim();

      if (!w.selectedCliqId) {
        showToast(State.lang === 'ar' ? 'يرجى اختيار حساب كليك للتحويل' : 'Please select a CliQ payment method', 'error');
        return;
      }
      if (!ref || !isValidCliqReference(ref)) {
        showToast(t('errInvalidCliqRef') || (State.lang === 'ar' ? 'يرجى إدخال رقم مرجع كليك صالح يحتوي على أرقام وحروف' : 'Please enter a valid CliQ reference containing letters and at least 3 digits'), 'error');
        return;
      }

      w.paymentReference = ref;
      w.step = 4;
      renderApp();
    },

    confirmBookingFinal: function() {
      const w = State.wizard;
      const farm = State.farms.find(f => f.id === w.farmId) || State.farms[0];
      const selectedCliq = State.cliqMethods.find(m => m.id === w.selectedCliqId) || State.cliqMethods[0];

      // Final atomic check against double booking
      const checkEnd = w.stayType === 'daily' ? w.checkIn : w.checkOut;
      if (!isVillaAvailable(w.farmId, w.checkIn, checkEnd)) {
        showToast(t('errDoubleBooking'), 'error');
        w.step = 1;
        renderApp();
        return;
      }

      const newBooking = {
        id: `res_${Date.now()}`,
        bookingNumber: w.bookingNumber,
        userId: 'guest',
        customerName: w.customerName.trim(),
        customerPhone: w.customerPhone.trim(),
        customerEmail: w.customerEmail ? w.customerEmail.trim() : '',
        farmId: w.farmId,
        farmName: farm.name.en,
        checkIn: w.checkIn,
        checkOut: checkEnd,
        checkInTime: w.checkInTime,
        checkOutTime: w.checkOutTime,
        guests: w.guests,
        stayType: w.stayType,
        basePrice: w.basePrice,
        weekendSurcharge: w.weekendSurcharge,
        extraGuestFee: w.extraGuestFee,
        cleaningFee: w.cleaningFee,
        discount: w.discount,
        promoCode: w.promoCode,
        total: w.total,
        bookingFeePercent: w.bookingFeePercent,
        bookingFee: w.bookingFee,
        paidAmount: 0,
        remainingAmount: w.total,
        paymentMethodId: selectedCliq.id,
        paymentMethodName: selectedCliq.name,
        cliqAlias: selectedCliq.alias,
        paymentReference: w.paymentReference,
        paymentProof: w.paymentProof || '',
        paymentStatus: 'Submitted',
        bookingStatus: 'Pending',
        emailStatus: w.customerEmail ? 'Sent' : 'None',
        notes: w.notes,
        verifiedBy: null,
        verifiedDate: null,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      // Create Payment Ledger Record
      const newPayment = {
        id: `pay_${Date.now()}`,
        reservationId: newBooking.id,
        bookingNumber: newBooking.bookingNumber,
        customerName: newBooking.customerName,
        customerPhone: newBooking.customerPhone,
        customerEmail: newBooking.customerEmail,
        farmId: newBooking.farmId,
        farmName: newBooking.farmName,
        totalPrice: newBooking.total,
        bookingFeePercent: newBooking.bookingFeePercent,
        requiredAmount: newBooking.bookingFee,
        amountPaid: 0,
        remainingAmount: newBooking.total,
        paymentMethodId: selectedCliq.id,
        paymentMethodName: selectedCliq.name,
        cliqAlias: selectedCliq.alias,
        paymentReference: newBooking.paymentReference,
        paymentProof: newBooking.paymentProof,
        status: 'Submitted',
        date: newBooking.createdAt,
        verifiedDate: null,
        verifiedBy: null,
        notes: 'Deposit submitted by customer via CliQ. Awaiting admin bank verification.'
      };

      State.bookings.unshift(newBooking);
      State.payments.unshift(newPayment);
      saveStorage('bookings');
      saveStorage('payments');
      try {
        sessionStorage.setItem('alora_last_booking', JSON.stringify(newBooking));
      } catch (_) {}

      // Persist the reservation centrally when the API is available. The local
      // write remains a resilient offline fallback for the static preview.
      if (typeof fetch === 'function' && window.location && window.location.origin) {
        fetch('/api/reservations', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(newBooking)
        }).then(async response => {
          if (!response.ok) {
            if (response.status === 404 || response.status === 405) return;
            const payload = await response.json().catch(() => ({}));
            showToast(payload.error || 'Unable to save reservation on the server', 'error');
            return;
          }
          const payload = await response.json();
          if (payload.reservation) {
            const index = State.bookings.findIndex(item => item.id === newBooking.id);
            if (index >= 0) State.bookings[index] = {...newBooking, ...payload.reservation};
            saveStorage('bookings');
          }
        }).catch(() => {
          console.warn('API endpoint unreachable; saved to local browser storage.');
        });
      }

      // Admin notification & activity logging
      createNotification(
        'New Payment Verification Required',
        `Customer ${newBooking.customerName} submitted ${newBooking.bookingFee} JOD for #${newBooking.bookingNumber} via ${selectedCliq.name} (Ref: ${newBooking.paymentReference})`,
        'payment_submitted',
        '#admin-payments'
      );

      recordActivity(
        'Customer submitted reservation & CliQ deposit',
        newBooking.bookingNumber,
        `Deposit: ${newBooking.bookingFee} JOD to ${selectedCliq.name} (Ref: ${newBooking.paymentReference})`
      );

      // Email Dispatch
      if (newBooking.customerEmail) {
        dispatchBookingEmail(newBooking, 'Reservation Received');
      }

      State.wizard.open = false;
      showToast(`Reservation #${newBooking.bookingNumber} submitted successfully!`, 'success');
      this.navigate('receipt', { id: newBooking.id });
    },

    autofillAdminDemo: function() {
      const email = document.getElementById('adminEmailInput');
      const pwd = document.getElementById('adminPasswordInput');

    handleAdminLogin: function(e, directEmail, directPwd) {
      if (e && e.preventDefault) e.preventDefault();
      const emailInput = document.getElementById('adminEmailInput');
      const pwdInput = document.getElementById('adminPasswordInput');

      const rawEmail = directEmail || (typeof e === 'string' ? e : (emailInput ? emailInput.value : ''));
      const rawPwd = directPwd || (pwdInput ? pwdInput.value : '');

      const email = (rawEmail || '').trim().toLowerCase();
      const pwd = (rawPwd || '').trim();

      const localLogin = () => {
        const adminUser = {
          id: 'usr_admin',
          name: 'ALORA Operations Team',
          email: 'admin@alora.jo',
          role: 'admin'
        };
        State.currentUser = adminUser;
        localStorage.setItem('alora_admin_user', JSON.stringify(adminUser));
        showToast(State.lang === 'ar' ? 'تم تسجيل الدخول بنجاح إلى بوابة الإدارة' : 'Authenticated into ALORA Operations Portal', 'success');
        this.navigate('admin');
      };

      const isDefaultCreds = (email === 'admin@alora.jo' && pwd === 'alora2026');

      // Check if we are running against a local Node backend on localhost:3000
      const isLocalHost = typeof window !== 'undefined' && window.location &&
        (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');

      if (isLocalHost && typeof fetch === 'function') {
        fetch('/api/admin/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, password: pwd })
        })
        .then(r => {
          if (r.ok) return r.json();
          // If server returned 401 (explicit bad creds on local server)
          if (r.status === 401) return { success: false };
          // If 404/500, fallback to default
          return isDefaultCreds ? { success: true } : { success: false };
        })
        .then(result => {
          if (result && result.success) {
            if (result.token) localStorage.setItem('alora_admin_token', result.token);
            localLogin();
          } else if (isDefaultCreds) {
            localLogin();
          } else {
            showToast(State.lang === 'ar' ? 'بيانات الاعتماد الإدارية غير صحيحة' : 'Invalid administrative credentials', 'error');
          }
        })
        .catch(() => {
          if (isDefaultCreds) localLogin();
          else showToast(State.lang === 'ar' ? 'بيانات الاعتماد الإدارية غير صحيحة' : 'Invalid administrative credentials', 'error');
        });
      } else {
        // Cloud static hosting (GitHub Pages, etc.) or offline/standalone mode
        if (isDefaultCreds) {
          localLogin();
        } else {
          showToast(State.lang === 'ar' ? 'بيانات الاعتماد الإدارية غير صحيحة' : 'Invalid administrative credentials', 'error');
        }
      }
    },

    // PAYMENT VERIFICATION & RULES
    verifyPaymentForBooking: function(resId) {
      const b = State.bookings.find(item => item.id === resId || item.bookingNumber === resId);
      if (!b) return;

      b.bookingStatus = 'Confirmed';
      b.paymentStatus = 'Verified';
      b.paidAmount = b.bookingFee || Math.round(b.total * 0.3);
      b.remainingAmount = Math.max(0, b.total - b.paidAmount);
      b.verifiedBy = State.currentUser ? State.currentUser.name : 'ALORA Operations Team';
      b.verifiedDate = new Date().toISOString();
      b.updatedAt = new Date().toISOString();

      // Update matching payment record
      const pay = State.payments.find(p => p.reservationId === b.id || p.bookingNumber === b.bookingNumber);
      if (pay) {
        pay.status = 'Verified';
        pay.amountPaid = b.paidAmount;
        pay.remainingAmount = b.remainingAmount;
        pay.verifiedBy = b.verifiedBy;
        pay.verifiedDate = b.verifiedDate;
      }

      saveStorage('bookings');
      saveStorage('payments');

      recordActivity(
        'Admin verified payment and confirmed reservation',
        b.bookingNumber,
        `Verified deposit of ${b.paidAmount} JOD via ${b.paymentMethodName || 'CliQ'}`
      );

      // Trigger real email confirmation
      if (b.customerEmail) {
        dispatchBookingEmail(b, 'Reservation Confirmed');
      }

      showToast(`Reservation #${b.bookingNumber} and CliQ deposit successfully verified!`, 'success');
      renderApp();
    },

    rejectPaymentForBooking: function(resId) {
      const b = State.bookings.find(item => item.id === resId || item.bookingNumber === resId);
      if (!b) return;

      b.bookingStatus = 'Rejected';
      b.paymentStatus = 'Rejected';
      b.verifiedBy = State.currentUser ? State.currentUser.name : 'ALORA Operations Team';
      b.verifiedDate = new Date().toISOString();
      b.updatedAt = new Date().toISOString();

      const pay = State.payments.find(p => p.reservationId === b.id || p.bookingNumber === b.bookingNumber);
      if (pay) {
        pay.status = 'Rejected';
        pay.verifiedBy = b.verifiedBy;
        pay.verifiedDate = b.verifiedDate;
      }

      saveStorage('bookings');
      saveStorage('payments');

      recordActivity(
        'Admin rejected payment and reservation',
        b.bookingNumber,
        'CliQ deposit rejected due to mismatched reference or non-receipt'
      );

      showToast(`Reservation #${b.bookingNumber} rejected`, 'error');
      renderApp();
    },

    saveVilla: function(e, id) {
      e.preventDefault();
      const nameEn = document.getElementById('vNameEn').value.trim();
      const nameAr = document.getElementById('vNameAr').value.trim();
      const city = document.getElementById('vCity').value.trim();
      const area = document.getElementById('vArea').value.trim();
      const price = parseFloat(document.getElementById('vPrice').value);
      const wPrice = parseFloat(document.getElementById('vWPrice').value);
      const cap = parseInt(document.getElementById('vCap').value, 10);
      const img = document.getElementById('vImg').value.trim();
      const descEn = document.getElementById('vDescEn').value.trim();
      const active = document.getElementById('vActive').checked;
      const featured = document.getElementById('vFeatured').checked;

      if (id) {
        const f = State.farms.find(item => item.id === id);
        if (f) {
          f.name.en = nameEn;
          f.name.ar = nameAr;
          f.location.city = city;
          f.location.area = area;
          f.price = price;
          f.weekendPrice = wPrice;
          f.capacity = cap;
          f.images[0] = img;
          if (!f.description) f.description = { en: descEn, ar: descEn };
          else f.description.en = descEn;
          f.active = active;
          f.featured = featured;
          recordActivity('Admin updated villa', f.name.en);
          showToast(`Villa ${nameEn} updated`, 'success');
        }
      } else {
        const newFarm = {
          id: `villa_${Date.now()}`,
          name: { en: nameEn, ar: nameAr },
          tagline: { en: descEn.slice(0, 80), ar: descEn.slice(0, 80) },
          description: { en: descEn, ar: descEn },
          location: { city, area, mapUrl: '' },
          capacity: cap,
          bedrooms: 3,
          bathrooms: 3,
          price: price,
          weekendPrice: wPrice,
          holidayPrice: Math.round(price * 1.5),
          extraGuestFee: 10,
          cleaningFee: 25,
          rating: 5.0,
          reviewCount: 1,
          status: 'active',
          active: active,
          featured: featured,
          images: [img],
          amenities: ['pool', 'wifi', 'ac', 'parking', 'bbq']
        };
        State.farms.push(newFarm);
        recordActivity('Admin added new villa', newFarm.name.en);
        showToast(`Villa ${nameEn} added successfully`, 'success');
      }

      saveStorage('farms');
      this.closeVillaModal();
    },

  // INITIALIZATION
  initStorage();
  function applyHashRoute() {
    const rawHash = window.location.hash || '';
    const cleanHash = rawHash.replace(/^#/, '');

    if (cleanHash === 'admin' || window.location.pathname === '/admin') {
      State.currentPage = 'admin';
      window.scrollTo(0, 0);
    } else if (cleanHash.startsWith('receipt')) {
      const parts = cleanHash.split('/');
      State.currentPage = 'receipt';
      State.params = { id: parts[1] || '' };
      window.scrollTo(0, 0);
    } else if (cleanHash.startsWith('villa/')) {
      const parts = cleanHash.split('/');
      State.currentPage = 'farm-details';
      State.params = { id: parts[1] || '' };
      State.selectedFarmId = parts[1] || '';
      window.scrollTo(0, 0);
    } else if (cleanHash === 'gallery') {
      State.currentPage = 'gallery';
      window.scrollTo(0, 0);
    } else if (cleanHash === 'villas') {
      State.currentPage = 'farms';
      window.scrollTo(0, 0);
    } else if (cleanHash === 'find-booking') {
      State.currentPage = 'find-booking';
      window.scrollTo(0, 0);
    } else if (cleanHash === 'policies') {
      State.currentPage = 'policies';
      window.scrollTo(0, 0);
    } else if (cleanHash === 'why-us' || cleanHash === 'contact' || cleanHash === 'featured-villas' || cleanHash === 'reviews' || cleanHash === 'instagram') {
      if (State.currentPage !== 'home') {
        State.currentPage = 'home';
        renderApp();
      }
      setTimeout(() => {
        const el = document.getElementById(cleanHash);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 80);
      return;
    } else if (!cleanHash || cleanHash === 'home') {
      State.currentPage = 'home';
      window.scrollTo(0, 0);
    }
    renderApp();
  }

  if (typeof window.addEventListener === 'function') window.addEventListener('hashchange', applyHashRoute);
  document.addEventListener('DOMContentLoaded', function() {
    applyHashRoute();
    syncServerData();
  });

})();

  </script>
</body>
</html>
