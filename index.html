  font-size: 1.35rem;
  font-weight: 800;
  color: var(--primary-900);
  margin-bottom: 0.5rem;
  line-height: 1.3;
}

.farm-card-tagline {
  font-size: 0.9rem;
  color: var(--neutral-600);
  margin-bottom: 1.25rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.farm-card-specs {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.85rem 0;
  border-top: 1px dashed var(--neutral-200);
  border-bottom: 1px dashed var(--neutral-200);
  margin-bottom: 1.25rem;
  font-size: 0.85rem;
  color: var(--neutral-700);
  font-weight: 600;
}

.spec-item {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.farm-amenity-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 1.5rem;
}

.amenity-chip {
  background: var(--earth-sand);
  color: var(--neutral-700);
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.25rem 0.6rem;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
}

.farm-card-footer {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}

.price-display {
  display: flex;
  flex-direction: column;
}

.price-starting-label {
  font-size: 0.75rem;
  color: var(--neutral-500);
  font-weight: 600;
}

.price-amount {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--primary-800);
}

.price-unit {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--neutral-600);
}

.card-actions {
  display: flex;
  gap: 0.5rem;
}

.btn-card-view {
  background: var(--neutral-100);
  color: var(--neutral-800);
  border: 1px solid var(--neutral-200);
  padding: 0.55rem 1rem;
  border-radius: var(--radius-full);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
}

.btn-card-view:hover {
  background: var(--neutral-200);
}

.btn-card-book {
  background: var(--primary-800);
  color: var(--white);
  border: none;
  padding: 0.55rem 1.2rem;
  border-radius: var(--radius-full);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 4px 10px rgba(22, 64, 46, 0.2);
}

.btn-card-book:hover {
  background: var(--primary-700);
  transform: translateY(-1px);
}

/* Why Choose Us Grid */
.features-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 2rem;
}

.feature-card {
  background: var(--white);
  padding: 2.25rem 1.75rem;
  border-radius: var(--radius-xl);
  border: 1px solid rgba(22, 64, 46, 0.06);
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  text-align: center;
}

.feature-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
  border-color: var(--primary-600);
}

.feature-icon-wrap {
  width: 64px;
  height: 64px;
  margin: 0 auto 1.5rem;
  border-radius: var(--radius-lg);
  background: var(--primary-50);
  color: var(--primary-700);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(41, 114, 82, 0.15);
}

.feature-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--primary-900);
  margin-bottom: 0.75rem;
}

.feature-desc {
  font-size: 0.95rem;
  color: var(--neutral-600);
  line-height: 1.6;
}

/* Instagram Section */
.instagram-section {
  background: linear-gradient(180deg, var(--earth-sand) 0%, #f3ede2 100%);
  border-top: 1px solid rgba(22, 64, 46, 0.08);
  border-bottom: 1px solid rgba(22, 64, 46, 0.08);
}

.instagram-banner {
  background: var(--white);
  border-radius: var(--radius-xl);
  padding: 2rem;
  margin-bottom: 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1.5rem;
  box-shadow: var(--shadow-md);
  border: 1px solid rgba(22, 64, 46, 0.06);
}

.ig-profile-info {
  display: flex;
  align-items: center;
  gap: 1.25rem;
}

.ig-avatar {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
}

.ig-avatar img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--white);
}

.ig-names h3 {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--neutral-900);
}

.ig-names p {
  font-size: 0.9rem;
  color: var(--neutral-600);
}

.btn-ig-follow {
  background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
  color: var(--white);
  border: none;
  padding: 0.75rem 1.6rem;
  border-radius: var(--radius-full);
  font-weight: 700;
  font-size: 0.95rem;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(220, 39, 67, 0.3);
  transition: var(--transition);
}

.btn-ig-follow:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(220, 39, 67, 0.4);
}

.ig-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 1rem;
}

.ig-card {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  aspect-ratio: 1 / 1;
  cursor: pointer;
}

.ig-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.ig-card-overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 44, 31, 0.75);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 0.5rem;
  color: var(--white);
  opacity: 0;
  transition: opacity 0.3s ease;
  padding: 1rem;
  text-align: center;
}

.ig-card:hover img {
  transform: scale(1.08);
}

.ig-card:hover .ig-card-overlay {
  opacity: 1;
}

.ig-stats {
  display: flex;
  gap: 1rem;
  font-size: 0.85rem;
  font-weight: 700;
}

/* Reviews Section */
.reviews-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem;
}

.review-card {
  background: var(--white);
  padding: 1.75rem;
  border-radius: var(--radius-xl);
  border: 1px solid rgba(22, 64, 46, 0.06);
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
}

.review-stars {
  display: flex;
  gap: 0.25rem;
  color: #f59e0b;
  margin-bottom: 0.85rem;
}

.review-text {
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--neutral-700);
  margin-bottom: 1.25rem;
  flex: 1;
  font-style: italic;
}

.review-author {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--neutral-200);
  padding-top: 0.75rem;
}

.author-name {
  font-weight: 700;
  color: var(--primary-900);
  font-size: 0.9rem;
}

.review-date {
  font-size: 0.8rem;
  color: var(--neutral-500);
}

/* Farm Details Page Layout */
.farm-detail-container {
  max-width: 1280px;
  margin: 2rem auto 4rem;
  padding: 0 1.5rem;
}

.farm-detail-header {
  margin-bottom: 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 1rem;
}

.farm-detail-title-wrap h1 {
  font-size: 2.4rem;
  font-weight: 800;
  color: var(--primary-900);
  line-height: 1.2;
}

.farm-detail-meta {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  margin-top: 0.5rem;
  font-size: 0.95rem;
  color: var(--neutral-600);
  font-weight: 600;
}

/* Gallery Grid */
.detail-gallery {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  grid-template-rows: 220px 220px;
  gap: 0.75rem;
  border-radius: var(--radius-xl);
  overflow: hidden;
  margin-bottom: 2.5rem;
  position: relative;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.gallery-item:first-child {
  grid-column: 1 / 2;
  grid-row: 1 / 3;
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.gallery-item:hover img {
  transform: scale(1.04);
}

.btn-open-all-photos {
  position: absolute;
  bottom: 1.25rem;
  right: 1.25rem;
  background: var(--white);
  color: var(--neutral-900);
  border: none;
  padding: 0.65rem 1.25rem;
  border-radius: var(--radius-full);
  font-size: 0.9rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  transition: var(--transition);
}

html[dir="rtl"] .btn-open-all-photos {
  right: auto;
  left: 1.25rem;
}

.btn-open-all-photos:hover {
  background: var(--primary-50);
  color: var(--primary-800);
}

/* Detail Main Grid */
.detail-layout {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 3rem;
}

.detail-info-pane {
  display: flex;
  flex-direction: column;
  gap: 2.5rem;
}

.detail-card {
  background: var(--white);
  border-radius: var(--radius-xl);
  padding: 2rem;
  border: 1px solid rgba(22, 64, 46, 0.08);
  box-shadow: var(--shadow-sm);
}

.detail-card-title {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--primary-900);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.amenities-full-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
}

.amenity-card-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  background: var(--earth-sand);
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--neutral-800);
}

.amenity-card-item svg {
  color: var(--primary-600);
  flex-shrink: 0;
}

/* Interactive Availability Calendar */
.calendar-widget {
  background: var(--white);
  border-radius: var(--radius-xl);
  padding: 1.5rem;
  border: 1px solid var(--neutral-200);
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
}

.calendar-month-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--primary-900);
}

.cal-nav-btn {
  background: var(--neutral-100);
  border: 1px solid var(--neutral-200);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
}

.cal-nav-btn:hover {
  background: var(--primary-100);
  color: var(--primary-800);
}

.calendar-days-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--neutral-500);
  margin-bottom: 0.5rem;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0.35rem;
}

.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  transition: var(--transition);
  border: 1px solid transparent;
}

.cal-day.empty {
  cursor: default;
  background: transparent;
}

.cal-day.available {
  background: var(--primary-50);
  color: var(--primary-900);
}

.cal-day.available:hover {
  background: var(--primary-100);
  border-color: var(--primary-500);
  transform: scale(1.05);
}

.cal-day.booked {
  background: var(--status-danger-bg);
  color: var(--status-danger);
  cursor: not-allowed;
  opacity: 0.75;
  text-decoration: line-through;
}

.cal-day.pending {
  background: var(--status-pending-bg);
  color: var(--status-pending);
  cursor: not-allowed;
}

.cal-day.blocked {
  background: var(--status-blocked-bg);
  color: var(--status-blocked);
  cursor: not-allowed;
  background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.05) 5px, rgba(0,0,0,0.05) 10px);
}

.cal-day.selected {
  background: var(--primary-700) !important;
  color: var(--white) !important;
  font-weight: 800;
  box-shadow: 0 4px 10px rgba(22, 64, 46, 0.35);
  transform: scale(1.06);
}

.calendar-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid var(--neutral-200);
  font-size: 0.8rem;
  font-weight: 600;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}

/* Sticky Booking Sidebar */
.detail-sidebar {
  position: relative;
}

.booking-card-sticky {
  position: sticky;
  top: 90px;
  background: var(--white);
  border-radius: var(--radius-xl);
  padding: 2rem;
  border: 1px solid rgba(22, 64, 46, 0.1);
  box-shadow: var(--shadow-xl);
}

.booking-card-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 1.5rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--neutral-200);
}

.sticky-price {
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--primary-900);
}

.pricing-table {
  background: var(--earth-sand);
  border-radius: var(--radius-md);
  padding: 1rem;
  margin-bottom: 1.5rem;
  font-size: 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.pricing-row {
  display: flex;
  justify-content: space-between;
  color: var(--neutral-700);
}

.btn-book-sidebar {
  width: 100%;
  background: linear-gradient(135deg, var(--primary-700), var(--primary-900));
  color: var(--white);
  border: none;
  padding: 1rem;
  border-radius: var(--radius-full);
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(22, 64, 46, 0.25);
  transition: var(--transition);
  margin-bottom: 0.85rem;
}

.btn-book-sidebar:hover {
  background: linear-gradient(135deg, var(--primary-600), var(--primary-800));
  transform: translateY(-2px);
}

.btn-whatsapp-sidebar {
  width: 100%;
  background: #25d366;
  color: var(--white);
  border: none;
  padding: 0.75rem;
  border-radius: var(--radius-full);
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  transition: var(--transition);
  box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
}

.btn-whatsapp-sidebar:hover {
  background: #20bd5a;
  transform: translateY(-2px);
}

/* Booking Modal & Multi-Step Wizard */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 44, 31, 0.6);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.modal-backdrop.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  background: var(--white);
  width: 100%;
  max-width: 680px;
  max-height: 90vh;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xl);
  overflow-y: auto;
  position: relative;
  transform: scale(0.95);
  transition: transform 0.3s ease;
}

.modal-backdrop.active .modal-card {
  transform: scale(1);
}

.modal-header {
  padding: 1.5rem 2rem;
  border-bottom: 1px solid var(--neutral-200);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--earth-sand);
}

.modal-title {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--primary-900);
}

.btn-modal-close {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--neutral-500);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-modal-close:hover {
  background: var(--neutral-200);
  color: var(--neutral-900);
}

.modal-body {
  padding: 2rem;
}

/* Wizard Steps Indicator */
.wizard-steps {
  display: flex;
  justify-content: space-between;
  margin-bottom: 2rem;
  position: relative;
}

.wizard-steps::before {
  content: '';
  position: absolute;
  top: 14px;
  left: 30px;
  right: 30px;
  height: 2px;
  background: var(--neutral-200);
  z-index: 1;
}

.wizard-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  position: relative;
  z-index: 2;
  cursor: pointer;
}

.step-num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--neutral-200);
  color: var(--neutral-600);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 700;
  transition: var(--transition);
}

.wizard-step.active .step-num {
  background: var(--primary-700);
  color: var(--white);
  box-shadow: 0 0 0 4px rgba(41, 114, 82, 0.2);
}

.wizard-step.completed .step-num {
  background: var(--status-success);
  color: var(--white);
}

.step-label {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--neutral-600);
}

.wizard-step.active .step-label {
  color: var(--primary-800);
}

/* Forms */
.form-group {
  margin-bottom: 1.25rem;
}

.form-label {
  display: block;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--neutral-700);
  margin-bottom: 0.4rem;
}

.form-control {
  width: 100%;
  padding: 0.75rem 1rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--neutral-200);
  background: var(--earth-sand);
  outline: none;
  font-size: 0.95rem;
  color: var(--neutral-900);
  transition: var(--transition);
}

.form-control:focus {
  border-color: var(--primary-600);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(41, 114, 82, 0.12);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.radio-group {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.25rem;
}

.radio-card {
  flex: 1;
  padding: 0.85rem;
  border-radius: var(--radius-md);
  border: 2px solid var(--neutral-200);
  background: var(--earth-sand);
  cursor: pointer;
  text-align: center;
  font-weight: 700;
  font-size: 0.85rem;
  transition: var(--transition);
}

.radio-card.active {
  border-color: var(--primary-600);
  background: var(--primary-50);
  color: var(--primary-900);
}

/* Promo Code Box */
.promo-box {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
}

.btn-apply-promo {
  background: var(--neutral-800);
  color: var(--white);
  border: none;
  padding: 0.75rem 1.25rem;
  border-radius: var(--radius-md);
  font-weight: 700;
  cursor: pointer;
}

/* Order Summary Box */
.order-summary-box {
  background: var(--earth-sand);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin: 1.5rem 0;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.summary-line {
  display: flex;
  justify-content: space-between;
  font-size: 0.95rem;
  color: var(--neutral-700);
}

.summary-line.total {
  border-top: 2px dashed var(--neutral-300);
  padding-top: 0.75rem;
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--primary-900);
}

/* Payment Selector */
.payment-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.payment-tab {
  padding: 0.75rem;
  border: 2px solid var(--neutral-200);
  border-radius: var(--radius-md);
  background: var(--white);
  cursor: pointer;
  text-align: center;
  font-size: 0.8rem;
  font-weight: 700;
  transition: var(--transition);
}

.payment-tab.active {
  border-color: var(--primary-600);
  background: var(--primary-50);
  color: var(--primary-900);
}

/* Confirmation & Official Digital Receipt */
.receipt-wrapper {
  max-width: 800px;
  margin: 3rem auto 5rem;
  padding: 0 1.5rem;
}

.receipt-card {
  background: var(--white);
  border-radius: var(--radius-xl);
  padding: 3rem;
  box-shadow: var(--shadow-xl);
  border: 1px solid rgba(22, 64, 46, 0.1);
  position: relative;
}

.receipt-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding-bottom: 2rem;
  border-bottom: 2px solid var(--primary-100);
  margin-bottom: 2rem;
}

.receipt-brand h2 {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--primary-900);
}

.receipt-badge-status {
  padding: 0.45rem 1.15rem;
  border-radius: var(--radius-full);
  font-size: 0.85rem;
  font-weight: 800;
  text-transform: uppercase;
}

.badge-paid {
  background: var(--status-success-bg);
  color: var(--status-success);
}

.badge-pending {
  background: var(--status-pending-bg);
  color: var(--status-pending);
}

.badge-confirmed {
  background: var(--primary-100);
  color: var(--primary-800);
}

.badge-cancelled {
  background: var(--status-danger-bg);
  color: var(--status-danger);
}

.receipt-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  margin-bottom: 2rem;
}

.receipt-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 2rem;
}

.receipt-table th {
  background: var(--earth-sand);
  padding: 0.75rem 1rem;
  text-align: left;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--neutral-700);
}

html[dir="rtl"] .receipt-table th {
  text-align: right;
}

.receipt-table td {
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--neutral-200);
  font-size: 0.95rem;
}

.receipt-actions {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin-top: 2rem;
}

/* Customer Portal & Admin Dashboard */
.dashboard-container {
  max-width: 1280px;
  margin: 2rem auto 5rem;
  padding: 0 1.5rem;
}

.dashboard-header {
  margin-bottom: 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}

.dashboard-nav-tabs {
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
  padding-bottom: 0.5rem;
  border-bottom: 2px solid var(--neutral-200);
  margin-bottom: 2rem;
}

.dash-tab-btn {
  background: none;
  border: none;
  padding: 0.75rem 1.25rem;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--neutral-600);
  cursor: pointer;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  white-space: nowrap;
  transition: var(--transition);
}

.dash-tab-btn.active {
  color: var(--primary-800);
  background: var(--white);
  border-bottom: 3px solid var(--primary-700);
}

.stat-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2.5rem;
}

.stat-card {
  background: var(--white);
  padding: 1.5rem;
  border-radius: var(--radius-xl);
  border: 1px solid rgba(22, 64, 46, 0.08);
  box-shadow: var(--shadow-sm);
}

.stat-label {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--neutral-500);
  margin-bottom: 0.5rem;
}

.stat-val {
  font-size: 2rem;
  font-weight: 800;
  color: var(--primary-900);
}

.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  margin-bottom: 3rem;
}

.chart-card {
  background: var(--white);
  padding: 1.75rem;
  border-radius: var(--radius-xl);
  border: 1px solid rgba(22, 64, 46, 0.08);
  box-shadow: var(--shadow-sm);
}

.chart-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--primary-900);
  margin-bottom: 1.25rem;
}

/* Data Table */
.table-wrapper {
  background: var(--white);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(22, 64, 46, 0.08);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

html[dir="rtl"] .data-table {
  text-align: right;
}

.data-table th {
  background: var(--earth-sand);
  padding: 1rem 1.25rem;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--neutral-700);
  border-bottom: 1px solid var(--neutral-200);
}

.data-table td {
  padding: 1.1rem 1.25rem;
  font-size: 0.9rem;
  border-bottom: 1px solid var(--neutral-100);
  color: var(--neutral-800);
}

.data-table tr:hover td {
  background: var(--earth-sand);
}

.btn-sm-action {
  padding: 0.35rem 0.75rem;
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: var(--transition);
}

.btn-approve {
  background: var(--status-success-bg);
  color: var(--status-success);
}
.btn-approve:hover {
  background: var(--status-success);
  color: var(--white);
}

.btn-reject {
  background: var(--status-danger-bg);
  color: var(--status-danger);
}
.btn-reject:hover {
  background: var(--status-danger);
  color: var(--white);
}

/* Floating Action Buttons */
.floating-actions {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  z-index: 900;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

html[dir="rtl"] .floating-actions {
  right: auto;
  left: 2rem;
}

.float-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  box-shadow: var(--shadow-lg);
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  text-decoration: none;
}

.float-btn:hover {
  transform: scale(1.1);
}

.float-whatsapp {
  background: #25d366;
}

.float-instagram {
  background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
}

/* Mobile Bottom Navigation */
.mobile-bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--neutral-200);
  z-index: 950;
  justify-content: space-around;
  align-items: center;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
}

.mob-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
  color: var(--neutral-600);
  font-size: 0.7rem;
  font-weight: 700;
  cursor: pointer;
}

.mob-nav-item.active {
  color: var(--primary-700);
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  top: 1.5rem;
  right: 1.5rem;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

html[dir="rtl"] .toast-container {
  right: auto;
  left: 1.5rem;
}

.toast {
  background: var(--white);
  color: var(--neutral-900);
  padding: 1rem 1.5rem;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-xl);
  border-left: 4px solid var(--primary-600);
  font-size: 0.95rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  min-width: 300px;
  animation: slideIn 0.3s ease;
}

html[dir="rtl"] .toast {
  border-left: none;
  border-right: 4px solid var(--primary-600);
}

.toast.toast-error {
  border-color: var(--status-danger);
}

.toast.toast-success {
  border-color: var(--status-success);
}

@keyframes slideIn {
  from { transform: translateY(-20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Footer */
.footer {
  background: var(--primary-900);
  color: rgba(255, 255, 255, 0.8);
  padding: 4rem 1.5rem 2rem;
  margin-top: auto;
}

.footer-container {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 3rem;
  margin-bottom: 3rem;
}

.footer-brand h2 {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--white);
  margin-bottom: 0.5rem;
}

.footer-col h4 {
  font-size: 1rem;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 1rem;
}

.footer-links {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  font-size: 0.9rem;
}

.footer-links a:hover {
  color: var(--earth-gold);
}

.footer-bottom {
  max-width: 1280px;
  margin: 0 auto;
  padding-top: 2rem;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
  font-size: 0.85rem;
}

/* Media Queries */
@media (max-width: 992px) {
  .detail-layout {
    grid-template-columns: 1fr;
  }
  .search-widget {
    grid-template-columns: 1fr 1fr;
  }
  .btn-search-submit {
    grid-column: span 2;
  }
  .charts-grid {
    grid-template-columns: 1fr;
  }
  .footer-container {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 768px) {
  .nav-links {
    display: none;
  }
  .mobile-menu-toggle {
    display: block;
  }
  .hero-title {
    font-size: 2.2rem;
  }
  .search-widget {
    grid-template-columns: 1fr;
  }
  .btn-search-submit {
    grid-column: 1;
  }
  .detail-gallery {
    grid-template-columns: 1fr;
    grid-template-rows: 240px 140px 140px;
  }
  .gallery-item:first-child {
    grid-column: 1;
    grid-row: 1;
  }
  .receipt-card {
    padding: 1.5rem;
  }
  .receipt-grid {
    grid-template-columns: 1fr;
  }
  .mobile-bottom-nav {
    display: flex;
  }
  body {
    padding-bottom: 70px;
  }
  .floating-actions {
    bottom: 5rem;
  }
}

/* Print Styles */
@media print {
  .navbar, .footer, .floating-actions, .mobile-bottom-nav, .receipt-actions, .nav-actions {
    display: none !important;
  }
  body, .main-content, .receipt-wrapper {
    background: #fff !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .receipt-card {
    box-shadow: none !important;
    border: 1px solid #ccc !important;
    padding: 1cm !important;
  }
}

/* Authentication & Profile Styling */
.auth-container {
  max-width: 520px;
  margin: 3rem auto 5rem;
  padding: 0 1.5rem;
}

.auth-card {
  background: var(--white);
  border-radius: var(--radius-xl);
  padding: 2.5rem 2rem;
  box-shadow: var(--shadow-xl);
  border: 1px solid rgba(22, 64, 46, 0.08);
}

.auth-header {
  text-align: center;
  margin-bottom: 2rem;
}

.auth-title {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--primary-900);
  margin-bottom: 0.5rem;
}

.auth-subtitle {
  font-size: 0.95rem;
  color: var(--neutral-600);
}

.auth-tabs {
  display: flex;
  background: var(--earth-sand);
  border-radius: var(--radius-full);
  padding: 0.35rem;
  margin-bottom: 2rem;
}

.auth-tab {
  flex: 1;
  text-align: center;
  padding: 0.6rem;
  border-radius: var(--radius-full);
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--neutral-600);
  cursor: pointer;
  transition: var(--transition);
}

.auth-tab.active {
  background: var(--white);
  color: var(--primary-900);
  box-shadow: var(--shadow-sm);
}

.auth-demo-grid {
  margin-top: 2rem;
  padding-top: 1.75rem;
  border-top: 1px dashed var(--neutral-200);
}

.auth-demo-title {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--neutral-500);
  margin-bottom: 0.75rem;
  letter-spacing: 0.05em;
  text-align: center;
}

.demo-chip-btn {
  width: 100%;
  padding: 0.65rem 1rem;
  background: var(--earth-sand);
  border: 1px solid var(--neutral-200);
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--neutral-800);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  margin-bottom: 0.5rem;
  transition: var(--transition);
}

.demo-chip-btn:hover {
  background: var(--primary-50);
  border-color: var(--primary-600);
  color: var(--primary-900);
}

/* User Menu Dropdown */
.user-menu-container {
  position: relative;
}

.user-menu-dropdown {
  position: absolute;
  top: 120%;
  right: 0;
  width: 240px;
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  border: 1px solid rgba(22, 64, 46, 0.1);
  padding: 0.5rem;
  z-index: 1000;
  display: none;
}

html[dir="rtl"] .user-menu-dropdown {
  right: auto;
  left: 0;
}

.user-menu-dropdown.active {
  display: block;
}

.user-menu-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.65rem 0.9rem;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--neutral-800);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
}

.user-menu-item:hover {
  background: var(--primary-50);
  color: var(--primary-800);
}

.user-menu-divider {
  height: 1px;
  background: var(--neutral-200);
  margin: 0.4rem 0;
}

/* Availability & Conflict Feedback Badges */
.conflict-alert-banner {
  background: var(--status-danger-bg);
  border: 1px solid #f87171;
  color: var(--status-danger);
  padding: 0.85rem 1.25rem;
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  font-weight: 700;
  margin: 1rem 0;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  animation: slideIn 0.3s ease;
}

.availability-badge-success {
  background: var(--status-success-bg);
  border: 1px solid #86efac;
  color: var(--status-success);
  padding: 0.75rem 1.25rem;
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  font-weight: 700;
  margin: 1rem 0;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.calendar-select-info {
  background: var(--earth-sand);
  border: 1px solid var(--neutral-200);
  padding: 0.75rem 1rem;
  border-radius: var(--radius-md);
  margin-bottom: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--neutral-700);
}

.btn-primary:disabled,
.btn-book-sidebar:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}


/* ALORA Brand Logo Component */
.alora-logo-container {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  cursor: pointer;
  text-decoration: none;
}

.alora-logo-icon {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
}

.alora-logo-text {
  display: flex;
  flex-direction: column;
}

.alora-logo-title {
  font-size: 1.5rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  color: var(--primary-900);
  line-height: 1;
}

.alora-logo-subtitle {
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.2em;
  color: var(--earth-gold);
  text-transform: uppercase;
  margin-top: 3px;
}

.footer .alora-logo-title {
  color: var(--white);
}

.footer .alora-logo-icon path[stroke="currentColor"] {
  stroke: var(--white);
}


/* ==========================================================================
   ALORA 4-STEP CUSTOMER BOOKING WIZARD
   ========================================================================== */
.booking-wizard-steps {
  display: flex;
  justify-content: space-between;
  margin-bottom: 2rem;
  position: relative;
}

.booking-wizard-steps::before {
  content: '';
  position: absolute;
  top: 18px;
  left: 30px;
  right: 30px;
  height: 2px;
  background: var(--neutral-200);
  z-index: 1;
}

.wizard-step-node {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  background: var(--white);
  padding: 0 0.5rem;
  cursor: pointer;
}

.step-node-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--neutral-100);
  border: 2px solid var(--neutral-300);
  color: var(--neutral-600);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  transition: var(--transition-fast);
}

.wizard-step-node.active .step-node-circle {
  background: var(--primary-800);
  border-color: var(--primary-800);
  color: var(--white);
  box-shadow: 0 0 0 4px rgba(17, 41, 31, 0.15);
}

.wizard-step-node.completed .step-node-circle {
  background: var(--success);
  border-color: var(--success);
  color: var(--white);
}

.step-node-label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--neutral-500);
  text-align: center;
}

.wizard-step-node.active .step-node-label {
  color: var(--primary-900);
  font-weight: 700;
}

.villa-preview-card {
  display: flex;
  gap: 1.5rem;
  background: var(--neutral-50);
  border: 1px solid var(--neutral-200);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  margin-bottom: 1.5rem;
  align-items: center;
}

.villa-preview-img {
  width: 140px;
  height: 100px;
  object-fit: cover;
  border-radius: var(--radius-md);
}

.wizard-summary-box {
  background: var(--neutral-50);
  border: 1px solid var(--neutral-200);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 0.6rem 0;
  border-bottom: 1px dashed var(--neutral-200);
  font-size: 0.92rem;
}

.summary-row:last-child {
  border-bottom: none;
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--primary-900);
  padding-top: 1rem;
}

/* ==========================================================================
   DEDICATED SEPARATE ADMIN PORTAL LAYOUT
   ========================================================================== */
.admin-shell {
  display: flex;
  min-height: 100vh;
  background: #f4f6f8;
  font-family: var(--font-sans);
}

.admin-sidebar {
  width: 280px;
  background: #0f1c16;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 100;
  box-shadow: 4px 0 15px rgba(0,0,0,0.15);
  transition: var(--transition-normal);
}

[dir="rtl"] .admin-sidebar {
  left: auto;
  right: 0;
  box-shadow: -4px 0 15px rgba(0,0,0,0.15);
}

.admin-sidebar-header {
  padding: 1.75rem 1.5rem;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.admin-badge {
  background: var(--earth-gold);
  color: #000;
  font-size: 0.65rem;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-left: auto;
}

[dir="rtl"] .admin-badge {
  margin-left: 0;
  margin-right: auto;
}

.admin-nav {
  flex: 1;
  padding: 1.25rem 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  overflow-y: auto;
}

.admin-nav-item {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.85rem 1rem;
  border-radius: var(--radius-md);
  color: #a0aec0;
  text-decoration: none;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition-fast);
}

.admin-nav-item:hover {
  background: rgba(255,255,255,0.06);
  color: #fff;
}

.admin-nav-item.active {
  background: #1b3a2c;
  color: #fff;
  border-left: 4px solid var(--earth-gold);
}

/* ==========================================================================

   ========================================================================== */

@keyframes aloraFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes aloraScaleUp {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(12px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@keyframes aloraFadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulseFloat {
  0%, 100% {
    transform: translateY(0) scale(1);
    box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
  }
  50% {
    transform: translateY(-6px) scale(1.06);

  to {

    transform: translateY(0);
  }
}

@keyframes toastSlideIn {

/* ==========================================================================

/* ─── BASE MOBILE UTILITIES ──────────────────────────────────────────────── */
* { -webkit-tap-highlight-color: transparent; }

/* Ensure smooth scrolling on touch devices */

/* ─── MOBILE BOTTOM NAV ─────────────────────────────────────────────────── */

/* ==========================================================================
   ALORA ADMIN — UNIFIED DESIGN SYSTEM (Buttons, Animations, Consistent UI)
   Matches the primary Book/Login button design across all admin elements
   ========================================================================== */

/* ─── ADMIN GLOBAL TOKENS ────────────────────────────────────────────────── */
:root {
  --admin-gold:       #C5A059;
  --admin-gold-light: rgba(197,160,89,0.12);
  --admin-gold-hover: rgba(197,160,89,0.22);
  --admin-green:      #0a1f16;
  --admin-green-mid:  #16402e;
  --admin-radius:     12px;
  --admin-radius-lg:  18px;
  --admin-shadow:     0 4px 18px rgba(10,31,22,0.10);
  --admin-shadow-lg:  0 10px 36px rgba(10,31,22,0.16);
  --admin-trans:      all 0.22s cubic-bezier(0.16,1,0.3,1);
}

/* ─── ADMIN SHELL ────────────────────────────────────────────────────────── */
.admin-shell {
  display: flex;
  min-height: 100vh;
  background: #f8fafc;
}

/* ─── ADMIN SIDEBAR ──────────────────────────────────────────────────────── */
.admin-sidebar {
  width: 240px;
  background: linear-gradient(180deg, #0a1f16 0%, #11291f 100%);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 50;
  border-right: 1px solid rgba(197,160,89,0.18);
  transition: width 0.3s cubic-bezier(0.16,1,0.3,1);
  scrollbar-width: thin;
  scrollbar-color: rgba(197,160,89,0.3) transparent;
}
.admin-sidebar::-webkit-scrollbar { width: 4px; }
.admin-sidebar::-webkit-scrollbar-thumb { background: rgba(197,160,89,0.3); border-radius: 4px; }

[dir="rtl"] .admin-sidebar {
  left: auto;
  right: 0;
  border-right: none;
  border-left: 1px solid rgba(197,160,89,0.18);
}

.admin-content-wrap {
  margin-left: 240px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  transition: margin 0.3s cubic-bezier(0.16,1,0.3,1);
}
[dir="rtl"] .admin-content-wrap {
  margin-left: 0;
  margin-right: 240px;
}

/* ─── SIDEBAR HEADER ─────────────────────────────────────────────────────── */
.admin-sidebar-header {
  padding: 1.25rem 1.25rem 1rem;
  border-bottom: 1px solid rgba(197,160,89,0.18);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.admin-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(197,160,89,0.15);
  color: #C5A059;
  border: 1px solid rgba(197,160,89,0.35);
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  width: fit-content;
  animation: fadeInDown 0.4s ease forwards;
}

/* ─── SIDEBAR NAV ITEMS ──────────────────────────────────────────────────── */
.admin-nav {
  flex: 1;
  padding: 0.75rem 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.admin-nav-item {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.75rem 1rem;
  border-radius: var(--admin-radius);
  cursor: pointer;
  transition: var(--admin-trans);
  font-size: 0.9rem;
  font-weight: 600;
  color: rgba(255,255,255,0.75);
  position: relative;
  user-select: none;
  min-height: 46px;
}

.admin-nav-item:hover {
  background: var(--admin-gold-hover) !important;
  color: #C5A059 !important;
  transform: translateX(3px);
}
[dir="rtl"] .admin-nav-item:hover { transform: translateX(-3px); }

.admin-nav-item.active {
  background: linear-gradient(135deg, rgba(197,160,89,0.22), rgba(197,160,89,0.10)) !important;
  color: #C5A059 !important;
  border: 1px solid rgba(197,160,89,0.3);
  box-shadow: 0 2px 10px rgba(197,160,89,0.15);
}

.admin-nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 20%;
  bottom: 20%;
  width: 3px;
  background: #C5A059;
  border-radius: 0 3px 3px 0;
}
[dir="rtl"] .admin-nav-item.active::before {
  left: auto;
  right: 0;
  border-radius: 3px 0 0 3px;
}

.admin-nav-item > span:first-child {
  font-size: 1.15rem;
  flex-shrink: 0;
  width: 22px;
  text-align: center;
}

.admin-nav-badge {
  margin-left: auto;
  background: #C5A059;
  color: #0a1f16;
  font-size: 0.68rem;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 20px;
  min-width: 20px;
  text-align: center;
  animation: pulse 2s infinite;
}
[dir="rtl"] .admin-nav-badge { margin-left: 0; margin-right: auto; }

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

/* ─── ADMIN TOPBAR ───────────────────────────────────────────────────────── */
.admin-topbar {
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  padding: 0.85rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: 0 1px 8px rgba(0,0,0,0.06);
}

.admin-page-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: #0a1f16;
  white-space: nowrap;
  flex-shrink: 0;
}

.admin-topbar-spacer { flex: 1; }

/* ─── UNIFIED BUTTON SYSTEM (matching Book/Login style) ─────────────────── */

/* Primary gold button — same gradient as Book Now */
.admin-btn-primary,
.btn-admin-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  padding: 0.65rem 1.4rem;
  background: linear-gradient(135deg, #C5A059, #b08030);
  color: #0a1f16 !important;
  border: none;
  border-radius: 9999px;
  font-size: 0.88rem;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
  transition: var(--admin-trans);
  box-shadow: 0 4px 14px rgba(197,160,89,0.35);
  min-height: 42px;
  text-decoration: none;
  letter-spacing: 0.01em;
}
.admin-btn-primary:hover, .btn-admin-primary:hover {
  background: linear-gradient(135deg, #d4b06e, #C5A059);
  box-shadow: 0 6px 20px rgba(197,160,89,0.45);
  transform: translateY(-2px);
}
.admin-btn-primary:active, .btn-admin-primary:active { transform: translateY(0); }

/* Secondary outline button */
.admin-btn-outline,
.btn-admin-outline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  padding: 0.6rem 1.25rem;
  background: transparent;
  color: #0a1f16 !important;
  border: 1.5px solid #0a1f16;
  border-radius: 9999px;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: var(--admin-trans);
  min-height: 40px;
}
.admin-btn-outline:hover, .btn-admin-outline:hover {
  background: #0a1f16;
  color: #ffffff !important;
  transform: translateY(-1px);
}

/* Danger button */
.admin-btn-danger,
.btn-admin-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  padding: 0.6rem 1.25rem;
  background: transparent;
  color: #b91c1c !important;
  border: 1.5px solid #b91c1c;
  border-radius: 9999px;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: var(--admin-trans);
  min-height: 40px;
}
.admin-btn-danger:hover, .btn-admin-danger:hover {
  background: #b91c1c;
  color: #ffffff !important;
  transform: translateY(-1px);
}

/* Ghost icon button */
.admin-btn-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: transparent;
  border: 1.5px solid #e2e8f0;
  cursor: pointer;
  font-size: 1rem;
  transition: var(--admin-trans);
  color: #64748b;
}
.admin-btn-icon:hover {
  background: var(--admin-gold-light);
  border-color: #C5A059;
  color: #C5A059;
  transform: scale(1.08);
}

/* ─── ADMIN CONTENT AREA ─────────────────────────────────────────────────── */
.admin-content {
  padding: 1.5rem;
  flex: 1;
  animation: fadeInUp 0.3s ease forwards;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─── ADMIN CARDS ────────────────────────────────────────────────────────── */
.admin-card {
  background: #ffffff;
  border: 1px solid #e8edf2;
  border-radius: var(--admin-radius-lg);
  box-shadow: var(--admin-shadow);
  overflow: hidden;
  transition: var(--admin-trans);
  animation: fadeInUp 0.3s ease both;
}
.admin-card:hover {
  box-shadow: var(--admin-shadow-lg);
  border-color: rgba(197,160,89,0.3);
}

.admin-card-header {
  padding: 1.1rem 1.25rem;
  border-bottom: 1px solid #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.admin-card-title {
  font-size: 1rem;
  font-weight: 800;
  color: #0a1f16;
}

.admin-card-subtitle {
  font-size: 0.8rem;
  color: #64748b;
  margin-top: 2px;
}

.admin-card-body {
  padding: 1.25rem;
}

/* ─── ADMIN SECTION HEADER ───────────────────────────────────────────────── */
.admin-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}

.admin-section-title {
  font-size: 1.2rem;
  font-weight: 800;
  color: #0a1f16;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.admin-section-subtitle {
  font-size: 0.82rem;
  color: #64748b;
  margin-top: 2px;
}

/* ─── ADMIN FILTER CHIPS ─────────────────────────────────────────────────── */
.admin-filter-bar {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

.admin-filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0.45rem 1rem;
  border-radius: 9999px;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  border: 1.5px solid #e2e8f0;
  background: #ffffff;
  color: #475569;
  transition: var(--admin-trans);
  white-space: nowrap;
  min-height: 36px;
}
.admin-filter-chip:hover {
  border-color: #C5A059;
  color: #C5A059;
  background: var(--admin-gold-light);
}
.admin-filter-chip.active {
  background: #0a1f16;
  color: #ffffff;
  border-color: #0a1f16;
  box-shadow: 0 2px 8px rgba(10,31,22,0.2);
}

/* ─── ADMIN TABLES ───────────────────────────────────────────────────────── */
.admin-table-container {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: var(--admin-radius);
  border: 1px solid #e8edf2;
}

.admin-table-container table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  min-width: 600px;
}

.admin-table-container table thead th {
  background: #f8fafc;
  padding: 0.75rem 1rem;
  text-align: left;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #64748b;
  border-bottom: 1px solid #e2e8f0;
  white-space: nowrap;
}
[dir="rtl"] .admin-table-container table thead th { text-align: right; }

.admin-table-container table tbody td {
  padding: 0.9rem 1rem;
  border-bottom: 1px solid #f1f5f9;
  color: #334155;
  vertical-align: middle;
}
[dir="rtl"] .admin-table-container table tbody td { text-align: right; }

.admin-table-container table tbody tr:last-child td { border-bottom: none; }

.admin-table-container table tbody tr {
  transition: background-color 0.15s ease;
}
.admin-table-container table tbody tr:hover {
  background: #f8fafc;
}

/* ─── STATUS BADGES ──────────────────────────────────────────────────────── */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 700;
  white-space: nowrap;
}
.status-badge.confirmed,
.status-badge.verified,
.status-badge.active {
  background: #dcfce7;
  color: #15803d;
}
.status-badge.pending,
.status-badge.submitted {
  background: #fef3c7;
  color: #b45309;
}
.status-badge.cancelled,
.status-badge.rejected,
.status-badge.inactive {
  background: #fee2e2;
  color: #b91c1c;
}
.status-badge.completed {
  background: #e0f2fe;
  color: #0369a1;
}
.status-badge.featured {
  background: rgba(197,160,89,0.15);
  color: #8c6d23;
  border: 1px solid rgba(197,160,89,0.3);
}

/* ─── ADMIN FORM INPUTS (match main site) ────────────────────────────────── */
.admin-form-input,
.admin-form-select,
.admin-form-textarea {
  width: 100%;
  padding: 0.7rem 1rem;
  border: 1.5px solid #e2e8f0;
  border-radius: var(--admin-radius);
  font-size: 0.9rem;
  font-family: inherit;
  background: #fcfbfa;
  color: #1e293b;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  min-height: 44px;
}
.admin-form-input:hover,
.admin-form-select:hover,
.admin-form-textarea:hover {
  border-color: #cbd5e0;
  background: #ffffff;
}
.admin-form-input:focus,
.admin-form-select:focus,
.admin-form-textarea:focus {
  background: #ffffff;
  border-color: #C5A059;
  box-shadow: 0 0 0 3.5px rgba(197,160,89,0.18);
}
[dir="rtl"] .admin-form-input,
[dir="rtl"] .admin-form-select,
[dir="rtl"] .admin-form-textarea {
  text-align: right;
}

.admin-form-label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  color: #374151;
  margin-bottom: 0.4rem;
}

/* ─── MODAL SYSTEM (consistent with main site + mobile sheet) ───────────── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(10,31,22,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.modal-backdrop.active {
  opacity: 1;
  pointer-events: all;
}

.modal-card {
  background: #ffffff;
  border-radius: 20px;
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 25px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(197,160,89,0.2);
  transform: translateY(20px) scale(0.97);
  transition: transform 0.28s cubic-bezier(0.16,1,0.3,1), opacity 0.25s ease;
  opacity: 0;
}
.modal-backdrop.active .modal-card {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.modal-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  position: sticky;
  top: 0;
  background: #ffffff;
  z-index: 1;
  border-radius: 20px 20px 0 0;
}

.modal-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: #0a1f16;
}

.modal-close-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f1f5f9;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  color: #64748b;
  transition: var(--admin-trans);
  flex-shrink: 0;
}
.modal-close-btn:hover {
  background: #fee2e2;
  color: #b91c1c;
  transform: rotate(90deg);
}

.modal-body {
  padding: 1.25rem 1.5rem;
}

.modal-footer {
  padding: 1rem 1.5rem;
  border-top: 1px solid #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.75rem;
  flex-wrap: wrap;
  position: sticky;
  bottom: 0;
  background: #ffffff;
  border-radius: 0 0 20px 20px;
}

/* ─── KPI CARDS ──────────────────────────────────────────────────────────── */
.admin-kpi-13-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  gap: 0.85rem;
  margin-bottom: 1.5rem;
}

.admin-kpi-mini-card {
  background: #ffffff;
  border: 1px solid #e8edf2;
  border-radius: var(--admin-radius-lg);
  padding: 1.1rem 1rem;
  display: flex;
  flex-direction: column;
  transition: var(--admin-trans);
  animation: fadeInUp 0.3s ease both;
  cursor: default;
}
.admin-kpi-mini-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--admin-shadow-lg);
  border-color: rgba(197,160,89,0.3);
}

/* ─── NOTIFICATIONS PANEL ─────────────────────────────────────────────────── */
.admin-notif-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 340px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  z-index: 200;
  overflow: hidden;
  animation: fadeInDown 0.2s ease forwards;
}
[dir="rtl"] .admin-notif-panel { right: auto; left: 0; }

/* ─── SEARCH RESULTS ─────────────────────────────────────────────────────── */
.admin-search-results {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  box-shadow: 0 10px 32px rgba(0,0,0,0.12);
  z-index: 200;
  overflow: hidden;
  max-height: 400px;
  overflow-y: auto;
  animation: fadeInDown 0.18s ease forwards;
}

/* ─── ADMIN LOGIN PAGE ───────────────────────────────────────────────────── */
.admin-login-wrapper {
  animation: fadeIn 0.4s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.admin-login-card {
  animation: fadeInUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
}

/* form inputs on login page same style as main site */
.admin-login-card .form-input {
  border-radius: var(--admin-radius) !important;
  border: 1.5px solid #e2e8f0 !important;
  min-height: 48px !important;
  font-size: 0.95rem !important;
  transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
}
.admin-login-card .form-input:focus {
  border-color: #C5A059 !important;
  box-shadow: 0 0 0 3.5px rgba(197,160,89,0.18) !important;
  outline: none !important;
}

/* login submit button — full width primary */
.admin-login-card .btn-primary {
  width: 100%;
  justify-content: center;
  padding: 0.9rem !important;
  font-size: 1rem !important;
  border-radius: 12px !important;
  box-shadow: 0 4px 18px rgba(197,160,89,0.35) !important;
}

/* ─── PRINT BUTTON IN ADMIN ──────────────────────────────────────────────── */
.admin-print-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 1rem;
  background: #f8fafc;
  border: 1.5px solid #e2e8f0;
  border-radius: var(--admin-radius);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  color: #374151;
  transition: var(--admin-trans);
}
.admin-print-btn:hover {
  background: var(--admin-gold-light);
  border-color: #C5A059;
  color: #C5A059;
}

/* ─── ADMIN EMPTY STATE ──────────────────────────────────────────────────── */
.admin-empty-state {
  text-align: center;
  padding: 3rem 1.5rem;
  color: #94a3b8;
}
.admin-empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.admin-empty-state .empty-title { font-size: 1rem; font-weight: 700; color: #475569; }
.admin-empty-state .empty-desc { font-size: 0.85rem; margin-top: 0.35rem; }

/* ─── ADMIN GALLERY GRID ─────────────────────────────────────────────────── */
.admin-gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 1rem;
}
.admin-gallery-item {
  border-radius: var(--admin-radius);
  overflow: hidden;
  border: 1px solid #e2e8f0;
  aspect-ratio: 16/9;
  position: relative;
  background: #f8fafc;
  transition: var(--admin-trans);
}
.admin-gallery-item:hover {
  transform: translateY(-2px);
  box-shadow: var(--admin-shadow);
}

/* ─── ADMIN TABS (inside account/settings pages) ────────────────────────── */
.admin-inner-tabs {
  display: flex;
  gap: 0.5rem;
  border-bottom: 2px solid #f1f5f9;
  margin-bottom: 1.25rem;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.admin-inner-tabs::-webkit-scrollbar { display: none; }

.admin-inner-tab {
  padding: 0.6rem 1.1rem;
  font-size: 0.85rem;
  font-weight: 700;
  color: #64748b;
  cursor: pointer;
  border-bottom: 2.5px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  transition: var(--admin-trans);
  min-height: 40px;
  display: flex;
  align-items: center;
}
.admin-inner-tab:hover { color: #0a1f16; }
.admin-inner-tab.active {
  color: #C5A059;
  border-bottom-color: #C5A059;
}

/* ─── BASE ADMIN DRAWER & MOBILE TOPBAR CONTROLS ───────────────────────── */
.admin-menu-toggle-btn {
  display: none;
  align-items: center;
  gap: 8px;
  background: #0a1f16;
  color: #C5A059;
  border: 1.5px solid rgba(197, 160, 89, 0.45);
  border-radius: 9999px;
  padding: 0.48rem 0.95rem;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  min-height: 42px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  font-family: inherit;
}
.admin-menu-toggle-btn:hover,
.admin-menu-toggle-btn:active {
  background: #143526;
  border-color: #C5A059;
  box-shadow: 0 4px 14px rgba(197, 160, 89, 0.35);
  transform: translateY(-1px);
}
.admin-topbar-mobile-header {
  display: none;
}
.admin-topbar-desktop-only {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.admin-topbar-mobile-brand {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.95rem;
}
.admin-topbar-mobile-quick {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

/* Mobile Slide-Out Drawer Navigation */
.admin-mobile-drawer-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.admin-mobile-drawer-backdrop.active {
  display: block !important;
  opacity: 1 !important;
}
.admin-mobile-drawer {
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  width: 320px;
  max-width: 86vw;
  background: #0a1f16;
  color: #ffffff;
  box-shadow: 4px 0 25px rgba(0, 0, 0, 0.5);
  display: flex;
  flex-direction: column;
  z-index: 10000;
  transform: translateX(-100%);
  transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
[dir="rtl"] .admin-mobile-drawer {
  left: auto;
  right: 0;
  transform: translateX(100%);
  box-shadow: -4px 0 25px rgba(0, 0, 0, 0.5);
}
.admin-mobile-drawer-backdrop.active .admin-mobile-drawer {
  transform: translateX(0) !important;
}
.admin-drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 1.25rem;
  border-bottom: 1px solid rgba(197, 160, 89, 0.2);
}
.admin-drawer-close-btn {
  background: rgba(255, 255, 255, 0.08);
  color: #e2e8f0;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.2s ease;
}
.admin-drawer-close-btn:hover {
  background: rgba(229, 62, 62, 0.25);
  color: #feb2b2;
  border-color: #e53e3e;
}
.admin-drawer-user {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 1rem 1.25rem;
  background: rgba(0, 0, 0, 0.25);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.admin-drawer-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0.85rem 0.75rem;
  flex: 1;
  overflow-y: auto;
}
.admin-drawer-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 0.75rem 1rem;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 12px;
  color: #e2e8f0;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  text-align: inherit;
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  font-family: inherit;
}
.admin-drawer-nav-item:hover {
  background: rgba(197, 160, 89, 0.12);
  color: #ffffff;
  border-color: rgba(197, 160, 89, 0.3);
  transform: translateX(4px);
}
[dir="rtl"] .admin-drawer-nav-item:hover {
  transform: translateX(-4px);
}
.admin-drawer-nav-item.active {
  background: linear-gradient(135deg, rgba(197, 160, 89, 0.32), rgba(197, 160, 89, 0.15));
  color: #C5A059;
  border-color: rgba(197, 160, 89, 0.6);
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
}
.admin-drawer-tab-icon {
  font-size: 1.25rem;
  line-height: 1;
}
.admin-drawer-tab-label {
  flex: 1;
}
.admin-drawer-footer {
  padding: 1rem 1.25rem;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(0, 0, 0, 0.2);
}

/* ─── RESPONSIVE — ADMIN DEDICATED PORTAL OVERHAUL ─────────────────────── */

/* Base helper classes for admin responsive controls */
.admin-tab-search-wrap {
  width: 280px;
  max-width: 100%;
}
.avail-matrix-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 0.5rem;
}
.avail-matrix-wrap::-webkit-scrollbar,
.admin-table-container::-webkit-scrollbar {
  height: 6px;
}
.avail-matrix-wrap::-webkit-scrollbar-track,
.admin-table-container::-webkit-scrollbar-track {
  background: #f1f5f9;
  border-radius: 9999px;
}
.avail-matrix-wrap::-webkit-scrollbar-thumb,
.admin-table-container::-webkit-scrollbar-thumb {
  background: #cbd5e0;
  border-radius: 9999px;
}
.avail-matrix-wrap::-webkit-scrollbar-thumb:hover,
.admin-table-container::-webkit-scrollbar-thumb:hover {
  background: #C5A059;
}

/* TABLETS LANDSCAPE & MEDIUM SCREENS (<= 1024px) */
@media (max-width: 1024px) {
  .admin-kpi-13-grid {
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 0.75rem !important;
  }
}

/* TABLETS & MOBILE PHONES (<= 900px) */
@media (max-width: 900px) {
  .admin-shell {
    flex-direction: column !important;
    min-height: 100vh !important;
  }

  /* Admin sidebar replaced by sleek drawer on mobile to eliminate header clipping */
  .admin-sidebar {
    display: none !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 990 !important;
    overflow-x: auto !important;
    width: 100% !important;
  }
  .admin-sidebar-header { display: none !important; }
  .admin-sidebar-footer { display: none !important; }

  .admin-nav {
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    width: max-content !important;
    gap: 0.35rem !important;
    padding: 0 !important;
  }
  .admin-nav-item {
    flex-shrink: 0 !important;
  }
  .admin-nav-item.active {
    color: #C5A059 !important;
  }

  .admin-content-wrap {
    margin-left: 0 !important;
    margin-right: 0 !important;
    width: 100% !important;
    min-width: 0 !important;
  }

  /* Mobile Header Row in Topbar */
  .admin-topbar-mobile-header {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    width: 100% !important;
    padding-bottom: 0.65rem !important;
    border-bottom: 1px solid #f1f5f9 !important;
    gap: 8px !important;
  }
  .admin-menu-toggle-btn {
    display: inline-flex !important;
  }
  .admin-topbar-desktop-only {
    display: none !important;
  }

  /* TOPBAR RESPONSIVENESS — FIX HEIGHT & KILL OVERLAPS */
  .admin-topbar {
    position: relative !important;
    top: auto !important;
    height: auto !important;
    min-height: auto !important;
    max-height: none !important;
    overflow: visible !important;
    padding: 0.85rem 1rem 1rem !important;
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 0.75rem !important;
    background: #ffffff !important;
    border-bottom: 1px solid #e2e8f0 !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04) !important;
  }
  .admin-topbar-brand-search {
    display: flex !important;
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 0.6rem !important;
    width: 100% !important;
  }
  .admin-page-title {
    font-size: 1.25rem !important;
    font-weight: 800 !important;
    color: #0a1f16 !important;
    margin: 0 !important;
  }
  .admin-search-wrapper {
    width: 100% !important;
    max-width: 100% !important;
    position: relative !important;
  }
  .admin-search-input {
    width: 100% !important;
    min-height: 44px !important;
    font-size: 16px !important;
  }
  .admin-topbar-actions {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    width: 100% !important;
    gap: 0.5rem !important;
    flex-wrap: wrap !important;
  }
  .admin-topbar-actions .btn {
    flex: 1 !important;
    min-height: 44px !important;
    font-size: 0.85rem !important;
    justify-content: center !important;
  }
  .btn-admin-create-res {
    width: 100% !important;
    justify-content: center !important;
    min-height: 44px !important;
  }
  .admin-tab-search-wrap {
    width: 100% !important;
    max-width: 100% !important;
    margin-top: 0.5rem !important;
  }

  .admin-content,
  .admin-main-container {
    padding: 1.25rem 1rem 2.5rem !important;
    width: 100% !important;
    max-width: 100vw !important;
    box-sizing: border-box !important;
    margin-top: 0 !important;
    clear: both !important;
  }

  /* 13-KPI GRID ON TABLETS / PHONES */
  .admin-kpi-13-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 0.65rem !important;
    margin-bottom: 1.25rem !important;
  }
  .admin-kpi-mini-card {
    padding: 0.85rem 0.75rem !important;
    border-radius: 14px !important;
  }
  .admin-kpi-val {
    font-size: 1.25rem !important;
    font-weight: 800 !important;
    word-break: break-word !important;
  }
  .admin-kpi-lbl {
    font-size: 0.72rem !important;
    line-height: 1.25 !important;
  }

  /* ADMIN TABLES — HORIZONTAL SCROLL & NO TEXT SQUISHING */
  .admin-table-container {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
    border-radius: 14px !important;
    border: 1px solid #e8edf2 !important;
    background: #ffffff !important;
    margin-bottom: 1.25rem !important;
  }
  .admin-table-container table {
    width: 100% !important;

/* ==========================================================================

/* ─── BTN-XS UPGRADE (admin table action buttons) ───────────────────────── */
.btn-xs {
  display: inline-flex !important;

  min-height: 32px !important;
  line-height: 1 !important;
}

.btn-xs.btn-primary {

  box-shadow: 0 2px 8px rgba(197,160,89,0.3) !important;
}
.btn-xs.btn-primary:hover {

  background: #0a1f16 !important;
  color: #ffffff !important;

/* Danger-tinted outline (inline style="color:#e53e3e") → override */
.btn-xs.btn-outline[style*="color:#e53e3e"],

}

.btn-xs.btn-outline[style*="color: #e53e3e"]:hover {

  border-color: #b91c1c !important;

/* Warning-tinted (color:#d69e2e) */

/* ─── SMOOTH PAGE TRANSITIONS ─────────────────────────────────────────────── */
.main-content,
#root,
.page-view {
  animation: pageEnter 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes pageEnter {
  from { opacity: 0.6; transform: translateY(8px); }
  to   { opacity: 1;   transform: translateY(0); }
}

/* ─── TOAST ANIMATION ─────────────────────────────────────────────────────── */
.toast {
  animation: toastSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
}
.toast.hiding {
  animation: toastSlideOut 0.25s ease forwards !important;
}
@keyframes toastSlideIn {
  from { opacity: 0; transform: translateX(30px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes toastSlideOut {
  from { opacity: 1; transform: translateX(0); }
  to   { opacity: 0; transform: translateX(30px); }
}
[dir="rtl"] .toast { animation-name: toastSlideInRtl !important; }
[dir="rtl"] .toast.hiding { animation-name: toastSlideOutRtl !important; }
@keyframes toastSlideInRtl {
  from { opacity: 0; transform: translateX(-30px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes toastSlideOutRtl {
  from { opacity: 1; transform: translateX(0); }
  to   { opacity: 0; transform: translateX(-30px); }
}

/* ─── CARD HOVER ANIMATIONS ──────────────────────────────────────────────── */
.farm-card,
.why-card,
.admin-kpi-mini-card,
.stat-card,
.auth-card {

}

/* ─── MOBILE NAV LINK ANIMATION ──────────────────────────────────────────── */

}
.mobile-nav-link:nth-child(1) { animation-delay: 0.02s; }
.mobile-nav-link:nth-child(2) { animation-delay: 0.04s; }
.mobile-nav-link:nth-child(3) { animation-delay: 0.06s; }
.mobile-nav-link:nth-child(4) { animation-delay: 0.08s; }
.mobile-nav-link:nth-child(5) { animation-delay: 0.10s; }
.mobile-nav-link:nth-child(6) { animation-delay: 0.12s; }
.mobile-nav-link:nth-child(7) { animation-delay: 0.14s; }
@keyframes slideInFromLeft {
  from { opacity: 0; transform: translateX(-16px); }
  to   { opacity: 1; transform: translateX(0); }
}
[dir="rtl"] .mobile-nav-link {
  animation-name: slideInFromRight;
}
@keyframes slideInFromRight {

   5. Standardized heartbeat pulse on actionable icons (no spinning/flipping).

    touch-action: manipulation !important;
    -webkit-tap-highlight-color: transparent !important;
    box-sizing: border-box !important;
  }

  /* Tactile active feedback for touch devices */
  .btn:active,
  button.btn:active,
  a.btn:active,
  .btn-primary:active,
  .btn-outline:active,
  .btn-secondary:active,
  .btn-villa-details:active,
  .btn-villa-book:active,
  .btn-card-book:active,
  .btn-card-view:active,
  .btn-back-to-villas:active,
  .btn-book-sidebar:active,
  .nav-reserve-btn:active,
  .top-bar-admin-btn:active,

  .admin-btn-outline:active,
  .admin-demo-btn:active,
  .admin-login-return-btn:active,

/* ==========================================================================

/* 1. RTL SCROLLBAR REMOVAL & VIEWPORT EDGE STABILIZATION
   Because the HTML document is set to an Arabic Right-to-Left (RTL) direction (dir="rtl"),
   the browser natively renders the primary vertical scrollbar on the far left side of the screen.
   To completely delete/hide the visual presence of this left scrollbar while retaining the
   ability to scroll the page, apply the following CSS globally: */
html::-webkit-scrollbar, body::-webkit-scrollbar {
    display: none; /* Hides scrollbar for Chrome, Safari and Opera */
}
html, body {
    -ms-overflow-style: none;  /* Hides scrollbar for IE and Edge */
    scrollbar-width: none;     /* Hides scrollbar for Firefox */
}

/* Enforce complete suppression across all viewport edges and browsers */
html::-webkit-scrollbar, body::-webkit-scrollbar, html::-webkit-scrollbar:horizontal, body::-webkit-scrollbar:horizontal, *::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

html, body {

  scrollbar-width: none !important;
  overflow-x: hidden !important;
  scrollbar-gutter: stable;
  width: 100% !important;
  max-width: 100vw !important;
}

/* 2. STANDARDIZED UI ANIMATION (CONTINUOUS HEARTBEAT)
   Globally applied cohesive animation state for primary interactive elements.
   Runs continuously in an infinite loop (animation: heartbeat 2s infinite ease-in-out;)
   and is NOT restricted to mouse :hover. The elements pulse constantly while resting on the page. */
@keyframes heartbeat {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05);
  }
}

  // LOCAL STORAGE PERSISTENCE
  function initStorage() {
    try {

      // Initialize collections with persistence
      State.users = JSON.parse(localStorage.getItem('alora_users')) || INITIAL_DATA.users;
      State.farms = JSON.parse(localStorage.getItem('alora_farms')) || INITIAL_DATA.farms;

      State.gallery = JSON.parse(localStorage.getItem('alora_gallery')) || INITIAL_DATA.gallery;
      State.bookings = JSON.parse(localStorage.getItem('alora_bookings')) || INITIAL_DATA.bookings;
      State.payments = JSON.parse(localStorage.getItem('alora_payments')) || INITIAL_DATA.payments;
      State.blockedDates = JSON.parse(localStorage.getItem('alora_blocked_dates')) || INITIAL_DATA.blockedDates;
